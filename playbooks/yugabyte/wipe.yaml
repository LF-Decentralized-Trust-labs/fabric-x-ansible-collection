- name: Wipe YugabyteDB clusters
  hosts: "{{ target_hosts | default('all') }}"
  tasks:
    - name: Wipe YugabyteDB node
      ansible.builtin.include_role:
        name: hyperledger.fabricx.yugabyte
        tasks_from: wipe
      when:
        - yugabyte_component_type is defined
