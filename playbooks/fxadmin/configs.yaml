# Renders fxadmin's configuration on every host that declares an admin organization.user.
# As with fxconfig, the identity is never taken from the control node: the crypto
# setup of the component running on the host already produced its MSP under
# remote_config_dir/users, and the node's own TLS identity is reused for mTLS.
#
# TLS settings describe the Fabric-X network fxadmin connects to, so they are read
# from the orderers rather than from the host being configured.
- name: Render fxadmin configuration on each admin host
  hosts: "{{ target_hosts | default('all') }}"
  tasks:
    # Hosts without an admin organization.user are skipped: fxadmin only runs where
    # an identity able to sign channel configuration updates is declared.
    - name: Render fxadmin configuration for this organization's identity
      vars:
        fxadmin_msp_config_path: "{{ remote_config_dir }}/users/{{ organization.user.name }}@{{ organization.domain }}/msp"
        fxadmin_use_tls: "{{ hostvars[groups['fabric_x_orderers'] | first].orderer_use_tls | default(false) }}"
        fxadmin_use_mtls: "{{ hostvars[groups['fabric_x_orderers'] | first].orderer_use_mtls | default(false) }}"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxadmin
        tasks_from: config/transfer
      when:
        - organization is defined
        - organization.user is defined
        - organization.user.type | default('') == 'admin'
