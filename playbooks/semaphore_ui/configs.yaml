- name: Configure Semaphore UI
  hosts: "{{ target_hosts | default('semaphore_ui') }}:&semaphore_ui"
  tasks:
    - name: Render configuration, run database migrations, and seed the Fabric-X project
      ansible.builtin.include_role:
        name: hyperledger.fabricx.semaphore_ui
        tasks_from: config/transfer
      when:
        - semaphore_ui_port is defined
