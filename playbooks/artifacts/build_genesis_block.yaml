- name: Create the genesis block
  hosts: localhost
  tasks:
    - name: Create the configuration file for armageddon
      vars:
        armageddon_orderer_hosts: "{{ groups['fabric_x_orderers'] }}"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.armageddon
        tasks_from: config/build
      when: "'fabric_x_orderers' in groups"
    - name: Generate shared_config.binpb
      ansible.builtin.include_role:
        name: hyperledger.fabricx.armageddon
        tasks_from: create_shared_config
      when: "'fabric_x_orderers' in groups"
    - name: Group orderers by organization
      vars:
        org_domain: "{{ hostvars[orderer].organization.domain }}"
        org_name: "{{ hostvars[orderer].organization.name }}"
        orderer_info:
          name: "{{ orderer }}"
      ansible.builtin.set_fact:
        configtxgen_orgs_by_domain: >-
          {{
            configtxgen_orgs_by_domain | default({}) | combine({
              org_domain: {
                'name': org_name,
                'domain': org_domain,
                'type': hostvars[orderer].organization.type
                  | default((configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('type', '')),
                'orderers': (
                  (configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('orderers', []) + [orderer_info]
                ),
                'peers': (configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('peers', [])
              }
            })
          }}
      loop: >-
        {{
          groups['fabric_x_orderers']
          | default([])
          | map('extract', hostvars)
          | selectattr('organization', 'defined')
          | selectattr('organization.role', 'defined')
          | selectattr('organization.role', '==', 'orderer')
          | map(attribute='inventory_hostname')
        }}
      loop_control:
        loop_var: orderer
    - name: Group peers by organization
      vars:
        org_domain: "{{ hostvars[peer].organization.domain }}"
        org_name: "{{ hostvars[peer].organization.name }}"
        peer_info:
          name: "{{ peer }}"
      ansible.builtin.set_fact:
        configtxgen_orgs_by_domain: >-
          {{
            configtxgen_orgs_by_domain | default({}) | combine({
              org_domain: {
                'name': org_name,
                'domain': org_domain,
                'type': hostvars[peer].organization.type
                  | default((configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('type', '')),
                'orderers': (configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('orderers', []),
                'peers': (
                  (configtxgen_orgs_by_domain | default({})).get(org_domain, {}).get('peers', []) + [peer_info]
                )
              }
            })
          }}
      loop: >-
        {{
          groups['all']
          | map('extract', hostvars)
          | selectattr('organization', 'defined')
          | selectattr('organization.role', 'defined')
          | selectattr('organization.role', '==', 'peer')
          | map(attribute='inventory_hostname')
        }}
      loop_control:
        loop_var: peer
    - name: Build Fabricx-compatible configuration file for configtxgen
      ansible.builtin.include_role:
        name: hyperledger.fabricx.configtxgen
        tasks_from: config/build
    - name: Install configtxgen as binary for Fabric-X
      ansible.builtin.include_role:
        name: hyperledger.fabricx.configtxgen
        tasks_from: bin/install
      when:
        - configtxgen_use_bin is defined
        - configtxgen_use_bin
    - name: Generate the genesis block for Fabric-X
      ansible.builtin.include_role:
        name: hyperledger.fabricx.configtxgen
        tasks_from: start
