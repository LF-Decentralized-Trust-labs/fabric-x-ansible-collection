- name: Discover existing Fabric-X namespaces
  hosts: "{{ target_hosts | default('all') }}"
  tasks:
    - name: Determine which declared namespaces need to be created or updated
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxconfig
        tasks_from: namespace/inspect
      when:
        - organization is defined
        - organization.namespaces is defined
        - organization.users is defined

- name: Create and update Fabric-X namespaces transactions on the control node
  hosts: localhost
  vars:
    fxconfig_artifacts_dir: "{{ config_build_dir }}/fxconfig-artifacts"
    targeted_hosts: >-
      {{
        groups[target_hosts]
        if target_hosts in groups
        else [target_hosts]
      }}
    fxconfig_namespaces_to_create: >-
      {{
        targeted_hosts
        | map('extract', hostvars)
        | selectattr('fxconfig_namespaces_to_create', 'defined')
        | map(attribute='fxconfig_namespaces_to_create')
        | flatten
        | unique
        | list
      }}
    fxconfig_namespaces_to_update: >-
      {{
        targeted_hosts
        | map('extract', hostvars)
        | selectattr('fxconfig_namespaces_to_update', 'defined')
        | map(attribute='fxconfig_namespaces_to_update')
        | map('dict2items')
        | flatten
        | items2dict
      }}
    fxconfig_namespaces_to_apply: >-
      {{
        fxconfig_namespaces_to_create
        + (
          fxconfig_namespaces_to_update.keys()
          | list
        )
      }}
  tasks:
    - name: Group hosts per namespace
      vars:
        fxconfig_hosts: "{{ targeted_hosts | default(groups['all']) }}"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxconfig
        tasks_from: namespace/group
      when:
        - fxconfig_namespaces_to_apply | length > 0
    - name: Create FabricX namespaces with fxconfig on the control node
      vars:
        bin_remote_dir: "{{ cli_bin_dir }}"
        fxconfig_namespace_id: "{{ current_namespace_with_hosts.namespace.id }}"
        fxconfig_namespace_policy: "{{ current_namespace_with_hosts.namespace.policy }}"
        fxconfig_output: "{{ fxconfig_artifacts_dir }}/{{ fxconfig_namespace_id }}/ns.json"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxconfig
        tasks_from: namespace/create
      loop: "{{ fxconfig_hosts_per_namespaces.values() }}"
      loop_control:
        loop_var: current_namespace_with_hosts
        label: "{{ fxconfig_namespace_id }}"
      when:
        - fxconfig_hosts_per_namespaces is defined
        - (fxconfig_namespace_id | string) in fxconfig_namespaces_to_create
    - name: Update FabricX namespaces with fxconfig on the control node
      vars:
        bin_remote_dir: "{{ cli_bin_dir }}"
        fxconfig_namespace_id: "{{ current_namespace_with_hosts.namespace.id }}"
        fxconfig_namespace_policy: "{{ current_namespace_with_hosts.namespace.policy }}"
        fxconfig_namespace_version: "{{ fxconfig_namespaces_to_update[fxconfig_namespace_id | string] }}"
        fxconfig_output: "{{ fxconfig_artifacts_dir }}/{{ fxconfig_namespace_id }}/ns.json"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxconfig
        tasks_from: namespace/update
      loop: "{{ fxconfig_hosts_per_namespaces.values() }}"
      loop_control:
        loop_var: current_namespace_with_hosts
        label: "{{ fxconfig_namespace_id }}"
      when:
        - fxconfig_hosts_per_namespaces is defined
        - (fxconfig_namespace_id | string) in fxconfig_namespaces_to_update

- name: Endorse Fabric-X namespace transactions
  hosts: "{{ target_hosts | default('all') }}"
  vars:
    fxconfig_artifacts_dir: "{{ config_build_dir }}/fxconfig-artifacts"
    fxconfig_namespaces_to_apply: >-
      {{
        (fxconfig_namespaces_to_create)
        + (fxconfig_namespaces_to_update.keys()
          | list
        )
      }}
  tasks:
    - name: Perform the namespace transaction endorsements
      when:
        - organization is defined
        - organization.namespaces is defined
        - fxconfig_namespaces_to_apply | length > 0
      block:
        - name: Get the endorser user
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: get_endorser
        - name: Endorse FabricX namespaces with fxconfig
          vars:
            fxconfig_tx_to_endorse: "{{ fxconfig_artifacts_dir }}/{{ fxconfig_namespace.id }}/ns.json"
            fxconfig_output: "{{ fxconfig_remote_config_dir }}/{{ fxconfig_namespace.id }}/endorsed/{{ fxconfig_endorser_user.name }}.json"
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: endorse
          loop: "{{ organization.namespaces }}"
          loop_control:
            loop_var: fxconfig_namespace
            label: "{{ fxconfig_namespace.id }}"
          when:
            - (fxconfig_namespace.id | string) in fxconfig_namespaces_to_apply

- name: Merge endorsed Fabric-X namespaces transactions on the control node
  hosts: localhost
  vars:
    fxconfig_artifacts_dir: "{{ config_build_dir }}/fxconfig-artifacts"
    targeted_hosts: >-
      {{
        groups[target_hosts]
        if target_hosts in groups
        else [target_hosts]
      }}
    fxconfig_declared_namespaces: >-
      {{
        targeted_hosts
        | map('extract', hostvars)
        | map('to_json')
        | map('from_json')
        | selectattr('organization', 'defined')
        | map(attribute='organization')
        | selectattr('namespaces', 'defined')
        | map(attribute='namespaces')
        | flatten
      }}
    fxconfig_namespaces_to_create: >-
      {{
        targeted_hosts
        | map('extract', hostvars)
        | selectattr('fxconfig_namespaces_to_create', 'defined')
        | map(attribute='fxconfig_namespaces_to_create')
        | flatten
        | unique
        | list
      }}
    fxconfig_namespaces_to_update: >-
      {{
        targeted_hosts
        | map('extract', hostvars)
        | selectattr('fxconfig_namespaces_to_update', 'defined')
        | map(attribute='fxconfig_namespaces_to_update')
        | map('dict2items')
        | flatten
        | items2dict
      }}
    fxconfig_namespaces_to_apply: >-
      {{
        fxconfig_namespaces_to_create
        + (
          fxconfig_namespaces_to_update.keys()
          | list
        )
      }}
  tasks:
    - name: Merge endorsed FabricX namespaces transactions in one single multi-endorsed transaction
      vars:
        bin_remote_dir: "{{ cli_bin_dir }}"
        fxconfig_endorsed_txs_dir: "{{ fxconfig_artifacts_dir }}/{{ fxconfig_namespace.id }}/endorsed"
        fxconfig_output: "{{ fxconfig_artifacts_dir }}/{{ fxconfig_namespace.id }}/merged.json"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fxconfig
        tasks_from: merge
      loop: "{{ fxconfig_declared_namespaces }}"
      loop_control:
        loop_var: fxconfig_namespace
        label: "{{ fxconfig_namespace.id }}"
      when:
        - (fxconfig_namespace.id | string) in fxconfig_namespaces_to_apply

- name: Submit Fabric-X namespace transactions
  hosts: "{{ target_hosts | default('all') }}"
  vars:
    fxconfig_namespaces_to_apply: >-
      {{
        (fxconfig_namespaces_to_create)
        + (fxconfig_namespaces_to_update.keys()
          | list
        )
      }}
  tasks:
    - name: Perform submission of FabricX namespace transactions
      when:
        - organization is defined
        - organization.namespaces is defined
        - fxconfig_namespaces_to_apply | length > 0
      block:
        - name: Group hosts per namespace
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: namespace/group
          when:
            - fxconfig_hosts_per_namespaces is undefined
        - name: Submit FabricX namespaces with fxconfig
          vars:
            fxconfig_namespace_id: "{{ fxconfig_namespace.id | string }}"
          ansible.builtin.include_role:
            name: hyperledger.fabricx.fxconfig
            tasks_from: namespace/submit
          loop: "{{ organization.namespaces }}"
          loop_control:
            loop_var: fxconfig_namespace
            label: "{{ fxconfig_namespace.id }}"
          when:
            - fxconfig_hosts_per_namespaces[fxconfig_namespace.id].hosts[0] == inventory_hostname # makes sure is run on a single node only
            - (fxconfig_namespace.id | string) in fxconfig_namespaces_to_apply
