- name: Fetch the logs from the Fabric-X EVM gateway
  hosts: "{{ target_hosts | default('fabric_x_evm') }}:&fabric_x_evm"
  tasks:
    - name: Fetch the logs from the Fabric-X EVM gateway
      ansible.builtin.include_role:
        name: hyperledger.fabricx.evm
        tasks_from: fetch_logs
