- name: Check prelisted identities are available
  ansible.builtin.fail:
    msg: "fabric_ca_use_prelisted_identities requires fabric_ca_registered_identities_names to be set."
  when:
    - fabric_ca_use_prelisted_identities
    - fabric_ca_registered_identities_names is undefined

- name: Register identities with Fabric CA client container
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fabric_ca
    tasks_from: client/container/register
  when:
    - not fabric_ca_client_use_bin

- name: Register identities with Fabric CA client binary
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fabric_ca
    tasks_from: client/bin/register
  when:
    - fabric_ca_client_use_bin
