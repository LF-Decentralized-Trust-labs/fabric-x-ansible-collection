# Enrolls the organization user declared in organization.user through the same
# client/register and client/enroll entry points every other identity uses. It
# gets an MSP identity and a dedicated TLS identity, rather than borrowing another
# node's TLS material, and fetches both to the control node in the cryptogen
# layout, so consumers such as fxadmin read one path whichever CA issued them.
#
# Runs delegated to the organization's Fabric CA host, which holds the CA client
# tooling and the bootstrap registrar identity (fabric_ca_admin).

- name: Resolve the organization user identity
  ansible.builtin.set_fact:
    fabric_ca_org_user_identity:
      name: "{{ organization.user.name }}"
      secret: "{{ organization.user.secret }}"
      type: "{{ organization.user.type }}"

- name: Register and enroll the organization user on the Fabric CA host
  vars:
    fabric_ca_host: "{{ organization.fabric_ca_host }}"
    fabric_ca_use_tls: "{{ hostvars[organization.fabric_ca_host].fabric_ca_use_tls | default(false) }}"
    fabric_ca_name: "{{ hostvars[organization.fabric_ca_host].fabric_ca_name }}"
    fabric_ca_server_effective_remote_config_dir: "{{ hostvars[organization.fabric_ca_host].fabric_ca_server_remote_config_dir | default(hostvars[organization.fabric_ca_host].remote_config_dir) }}"
    fabric_ca_tls_certfile: "{{ fabric_ca_server_effective_remote_config_dir }}/{{ hostvars[organization.fabric_ca_host].fabric_ca_server_tls_cert_file | default('tls-cert.pem') }}"
    fabric_ca_identity: "{{ fabric_ca_org_user_identity }}"
    # delegate_to keeps this play's variable context, so the default would look
    # for fabric-ca-client under the control node's own bin directory, where it
    # is never installed. It lives on the CA host.
    bin_remote_dir: "{{ hostvars[organization.fabric_ca_host].remote_node_dir }}/bin"
    # Scratch directory for the enrolled identity, staged under the CA host's own
    # config dir rather than /tmp: a container runtime's host-mount sharing (for
    # example Podman Machine on macOS) is not guaranteed to reach /tmp.
    fabric_ca_org_user_scratch_dir: "{{ fabric_ca_server_effective_remote_config_dir }}/users-enroll/{{ organization.domain }}/{{ organization.user.name }}"
  delegate_to: "{{ organization.fabric_ca_host }}"
  block:
    - name: Register the organization user {{ organization.user.name }}
      vars:
        fabric_ca_msp_dir: "{{ fabric_ca_server_effective_remote_config_dir }}/{{ hostvars[organization.fabric_ca_host].fabric_ca_admin.name }}/msp"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/register

    - name: Enroll the organization user {{ organization.user.name }} MSP identity
      vars:
        fabric_ca_msp_dir: "{{ fabric_ca_org_user_scratch_dir }}/msp"
        # Overridden because the default derives from remote_node_dir, which
        # resolves against this play's own host rather than the delegated CA host.
        fabric_ca_client_state_file: "{{ fabric_ca_org_user_scratch_dir }}/fabric-ca-enroll-state-msp.yaml"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/enroll

    - name: Enroll the organization user {{ organization.user.name }} TLS identity
      vars:
        fabric_ca_msp_dir: "{{ fabric_ca_org_user_scratch_dir }}/tls"
        fabric_ca_enrollment_profile: tls
        fabric_ca_client_state_file: "{{ fabric_ca_org_user_scratch_dir }}/fabric-ca-enroll-state-tls.yaml"
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/enroll

    - name: Find the enrolled organization user files
      ansible.builtin.find:
        paths:
          - "{{ fabric_ca_org_user_scratch_dir }}/msp"
          - "{{ fabric_ca_org_user_scratch_dir }}/tls"
        recurse: true
        file_type: file
      register: fabric_ca_org_user_files

    - name: Fetch the enrolled organization user {{ organization.user.name }} to the control node
      vars:
        # Renamed from Fabric CA's tls/server.{crt,key} to cryptogen's
        # tls/client.{crt,key}, so the fetched layout matches the cryptogen path.
        fabric_ca_org_user_relative_path: >-
          {{
            current_enrolled_file.path
            | replace(fabric_ca_org_user_scratch_dir ~ '/', '')
            | replace('tls/server.crt', 'tls/client.crt')
            | replace('tls/server.key', 'tls/client.key')
          }}
      ansible.builtin.fetch:
        src: "{{ current_enrolled_file.path }}"
        dest: >-
          {{
            fetched_artifacts_dir
          }}/crypto/organizations/{{ organization.domain }}/users/{{ organization.user.name }}@{{ organization.domain }}/{{
            fabric_ca_org_user_relative_path
          }}
        flat: true
      loop: "{{ fabric_ca_org_user_files.files }}"
      loop_control:
        loop_var: current_enrolled_file
        label: "{{ current_enrolled_file.path }}"

    - name: Remove the temporary enrollment scratch directory
      ansible.builtin.file:
        path: "{{ fabric_ca_org_user_scratch_dir }}"
        state: absent
