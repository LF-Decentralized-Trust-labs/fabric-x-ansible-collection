# =========================
# Drift detection
# =========================
# BCCSP identities are drift-checked: a certificate whose CN, SANs, or enrollment type/profile
# no longer matches what it was issued with is reenrolled below rather than left stale. Idemix
# enrollment has no SANs and nothing else that can meaningfully drift, so it keeps the simpler
# exists-or-enroll check it always had. Either way, client/inspect publishes
# fabric_ca_client_must_enroll and fabric_ca_client_must_reenroll.
- name: Inspect the existing Fabric CA enrollment
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fabric_ca
    tasks_from: client/inspect

# =========================
# Enroll
# =========================
- name: Enroll the identity
  when:
    - fabric_ca_client_must_enroll
  block:
    - name: Enroll identity with Fabric CA client container
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/container/enroll
      when:
        - not fabric_ca_client_use_bin
    - name: Enroll all identities with Fabric CA client binary
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/bin/enroll
      when:
        - fabric_ca_client_use_bin

# =========================
# Reenroll
# =========================
# Only reached for a BCCSP identity that already exists but whose fingerprint no longer
# matches. Idemix never reenrolls: client/inspect always sets fabric_ca_client_must_reenroll
# to false for it.
- name: Reenroll the identity
  when:
    - fabric_ca_client_must_reenroll
  block:
    - name: Reenroll identity with Fabric CA client container
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/container/reenroll
      when:
        - not fabric_ca_client_use_bin
    - name: Reenroll identity with Fabric CA client binary
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/bin/reenroll
      when:
        - fabric_ca_client_use_bin

# =========================
# TLS trust chain
# =========================
# Enrolling against an intermediate Fabric CA makes the client split the chain it receives the way an
# MSP expects it: the root lands in the file named by --mycacertfile and the intermediates go to
# tlsintermediatecerts under names derived from the CA URL. Consumers of the TLS profile treat that
# single CA file as a complete truststore, so on its own it leaves them trusting the root while
# servers present a bare leaf signed by the intermediate. Concatenate the two back together.
#
# Restricted to the TLS profile on purpose: the MSP profile writes a genuine Fabric MSP directory that
# is already correct, and bundling there would hide the intermediate, since Fabric reads only the first
# PEM block of each file in an MSP directory.
- name: Rebuild the TLS certificate chains for an intermediate Fabric CA
  when:
    - fabric_ca_enrollment_type == 'bccsp'
    - fabric_ca_enrollment_profile | default('') == 'tls'
    - fabric_ca_client_must_enroll or fabric_ca_client_must_reenroll
    - fabric_ca_chain_ca_certs or fabric_ca_chain_server_certs
  block:
    # Names here are generated by the client, so collect whatever is present rather than guessing them.
    - name: Find the enrolled TLS intermediate certificates
      ansible.builtin.find:
        paths: "{{ fabric_ca_msp_dir }}/tlsintermediatecerts"
        patterns: "*.pem"
      register: fabric_ca_client_tls_intermediate_certs

    - name: Build the TLS CA certificate chain
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/intermediate_ca/build_ca_chain
      when:
        - fabric_ca_chain_ca_certs

    - name: Build the TLS server certificate chain
      ansible.builtin.include_role:
        name: hyperledger.fabricx.fabric_ca
        tasks_from: client/intermediate_ca/build_server_chain
      when:
        - fabric_ca_chain_server_certs

# =========================
# State
# =========================
- name: Write the Fabric CA enrollment state file
  vars:
    fabric_ca_client_state_fingerprints: >-
      {{
        fabric_ca_client_recorded_fingerprints | default({})
        | combine({
          fabric_ca_client_artifact_path: fabric_ca_client_current_fingerprint
        })
      }}
  ansible.builtin.template:
    src: fabric-ca-enroll-state.yaml.j2
    dest: "{{ fabric_ca_client_state_file }}"
    mode: "0o644"
  when:
    - fabric_ca_enrollment_type == 'bccsp'
    - fabric_ca_client_must_enroll or fabric_ca_client_must_reenroll
