---
argument_specs:
  role-options:
    short_description: Shared option catalog for evm role entry points
    options:
      remote_config_dir: &remote_config_dir
        type: path
        description:
          - Base remote config directory that feeds C(evm_remote_config_dir).
          - "Example: C(/var/hyperledger/fabricx/evm/config)."
      remote_data_dir: &remote_data_dir
        type: path
        description:
          - Base remote data directory that feeds C(evm_remote_data_dir).
          - "Example: C(/var/hyperledger/fabricx/evm/data)."
      fetched_artifacts_dir: &fetched_artifacts_dir
        type: path
        description:
          - Local artifacts directory used for fetched crypto material.
          - "Example: C(/tmp/fabricx-artifacts)."
      cryptogen_artifacts_dir: &cryptogen_artifacts_dir
        type: path
        description:
          - Local cryptogen output directory.
          - Required when C(organization.fabric_ca_host) is undefined.
          - "Example: C(/tmp/fabricx-crypto)."
      actual_host: &actual_host
        type: str
        description:
          - Real machine host.
          - "Example: C(myvpc.cloud.ibm.com)."
      organization: &organization
        type: dict
        required: true
        description:
          - Sets the organization mapping used for the embedded endorser's peer identity, the gateway's signing identity, and client TLS.
          - C(organization.role) must be C(peer).
          - When C(organization.fabric_ca_host) is undefined, crypto material generated by C(cryptogen) is transferred; otherwise the identities are enrolled with Fabric CA.
          - C(organization.users) must declare at least one user; the first entry becomes the gateway's transaction-signing identity.
          - C(organization.namespaces) must declare exactly one entry; the gateway can only serve a single Fabric-X application namespace, and C(config/transfer) fails otherwise.
          - "Example: C({'name': 'Org1', 'domain': 'org1.example.com', 'role': 'peer', 'fabric_ca_host': 'fca-org1', 'peer': {'name': 'fabric-x-evm', 'secret': 'fabric-x-evmPWD'}, 'users': [{'name': 'fabric-x-evm', 'secret': 'fabric-x-evmPWD'}], 'namespaces': [{'id': 'basic', 'policy': 'threshold'}]})."
      channel_id: &channel_id
        type: str
        required: true
        description:
          - Fabric channel rendered into the gateway configuration.
          - "Example: C(arma)."
      committer_hosts: &committer_hosts
        type: list
        elements: str
        required: true
        description:
          - Committer inventory hosts used to derive the committer sidecar the gateway and embedded endorser synchronize with.
          - The sidecar is selected as the entry whose C(committer_component_type) is C(sidecar); when the caller scopes this list to hosts sharing C(organization.domain) with the EVM host, that selection also confirms the sidecar belongs to the same organization.
          - "Example: C(['committer-sidecar', 'committer-validator'])."
      orderer_router_hosts: &orderer_router_hosts
        type: list
        elements: str
        required: true
        description:
          - Names the inventory hosts that provide the Fabric-X Orderer routers the gateway submits transactions to.
          - One orderer endpoint is rendered per entry, across every organization.
          - "Example: C(['orderer-router-1', 'orderer-router-2', 'orderer-router-3', 'orderer-router-4'])."
      sidecar_host: &sidecar_host
        type: str
        description:
          - Committer sidecar host derived from C(committer_hosts) by C(config/transfer) or C(k8s/start); consumed directly by C(k8s/config/transfer), which is always included from within their scope.
          - "Example: C(committer-sidecar)."
      k8s_namespace: &k8s_namespace
        type: str
        description:
          - Kubernetes namespace used for EVM resources.
          - "Example: C(fabricx-evm)."
      k8s_image_pull_secret: &k8s_image_pull_secret
        type: str
        description:
          - Optional image pull secret used by the EVM StatefulSet.
          - "Example: C(fabricx-registry-pull)."
      k8s_resources: &k8s_resources
        type: dict
        description:
          - Optional Kubernetes container resource requests and limits.
          - "Example: C({'requests': {'memory': '512Mi', 'cpu': '250m'}, 'limits': {'memory': '1Gi', 'cpu': '1000m'}})."
      k8s_storage_class: &k8s_storage_class
        type: str
        description:
          - StorageClass used for the EVM data PersistentVolumeClaim.
          - "Example: C(standard)."
      k8s_storage_size: &k8s_storage_size
        type: str
        description:
          - Requested storage size for the EVM data PersistentVolumeClaim.
          - "Example: C(500Mi)."
      k8s_readiness_probe_initial_delay_seconds: &k8s_readiness_probe_initial_delay_seconds
        type: int
        description:
          - Sets the EVM readiness probe initial delay.
          - "Example: C(10)."
      k8s_readiness_probe_period_seconds: &k8s_readiness_probe_period_seconds
        type: int
        description:
          - Sets the EVM readiness probe period.
          - "Example: C(10)."
      k8s_readiness_probe_timeout_seconds: &k8s_readiness_probe_timeout_seconds
        type: int
        description:
          - Sets the EVM readiness probe timeout.
          - "Example: C(5)."
      k8s_readiness_probe_failure_threshold: &k8s_readiness_probe_failure_threshold
        type: int
        description:
          - Sets the EVM readiness probe failure threshold.
          - "Example: C(3)."
      k8s_liveness_probe_initial_delay_seconds: &k8s_liveness_probe_initial_delay_seconds
        type: int
        description:
          - Sets the EVM liveness probe initial delay.
          - "Example: C(30)."
      k8s_liveness_probe_period_seconds: &k8s_liveness_probe_period_seconds
        type: int
        description:
          - Sets the EVM liveness probe period.
          - "Example: C(15)."
      k8s_liveness_probe_timeout_seconds: &k8s_liveness_probe_timeout_seconds
        type: int
        description:
          - Sets the EVM liveness probe timeout.
          - "Example: C(5)."
      k8s_liveness_probe_failure_threshold: &k8s_liveness_probe_failure_threshold
        type: int
        description:
          - Sets the EVM liveness probe failure threshold.
          - "Example: C(5)."
      evm_use_k8s: &evm_use_k8s
        type: bool
        default: false
        description:
          - Use Kubernetes resources.
      evm_use_openshift: &evm_use_openshift
        type: bool
        default: false
        description:
          - Selects the OpenShift deployment branch.
      evm_use_container: &evm_use_container
        type: bool
        default: "{{ (not evm_use_k8s) and (not evm_use_openshift) }}"
        description:
          - Run the container runtime.
      evm_registry_endpoint: &evm_registry_endpoint
        type: str
        default: "{{ lookup('env', 'EVM_REGISTRY_ENDPOINT') or 'ghcr.io/hyperledger' }}"
        description:
          - Image registry endpoint.
      evm_image_name: &evm_image_name
        type: str
        default: fabric-x-evm
        description:
          - Image name used by the EVM container.
      evm_image_tag: &evm_image_tag
        type: str
        default: "0.1.3"
        description:
          - Image tag used by the EVM container.
      evm_image: &evm_image
        type: str
        default: "{{ evm_registry_endpoint }}/{{ evm_image_name }}:{{ evm_image_tag }}"
        description:
          - EVM container image.
      evm_container_name: &evm_container_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - Container name used by the runtime.
      evm_remote_config_dir: &evm_remote_config_dir
        type: path
        default: "{{ remote_config_dir }}"
        description:
          - Remote config directory used by EVM.
      evm_container_config_dir: &evm_container_config_dir
        type: path
        default: /config
        description:
          - Config mount path inside a container or pod.
      evm_config_file: &evm_config_file
        type: str
        default: gateway.yaml
        description:
          - Rendered EVM gateway configuration filename.
      evm_remote_data_dir: &evm_remote_data_dir
        type: path
        default: "{{ remote_data_dir }}"
        description:
          - Remote data directory used by EVM for the gateway and embedded endorser SQLite state.
      evm_container_data_dir: &evm_container_data_dir
        type: path
        default: /data
        description:
          - Data mount path inside a container or pod for the gateway and embedded endorser SQLite state.
      evm_port: &evm_port
        type: int
        required: true
        description:
          - Ethereum JSON-RPC (HTTP and WebSocket) port exposed by the gateway.
          - "Example: C(8545)."
      evm_chain_id: &evm_chain_id
        type: int
        default: 4011
        description:
          - Ethereum-style chain ID served by the gateway.
      evm_ns_version: &evm_ns_version
        type: str
        default: "1.0"
        description:
          - Version of the Fabric-X application namespace.
      evm_protocol: &evm_protocol
        type: str
        default: fabric-x
        description:
          - Network protocol the gateway speaks to the committer and orderers, C(fabric-x) or C(fabric).
      evm_log_level: &evm_log_level
        type: str
        default: info
        description:
          - Log level specification passed to C(logging.spec).
      evm_log_format: &evm_log_format
        type: str
        default: "%{color}%{time:2006-01-02 15:04:05.000 MST} [%{module}] %{shortfunc} -> %{level:.4s}%{color:reset} %{message}"
        description:
          - Log record format specifier passed to C(logging.format).
      evm_worker_count: &evm_worker_count
        type: int
        default: 16
        description:
          - Number of gateway worker goroutines.
      evm_submitter_count: &evm_submitter_count
        type: int
        default: 16
        description:
          - Number of parallel orderer submitter instances.
      evm_endorsement_chan_size: &evm_endorsement_chan_size
        type: int
        default: 1000
        description:
          - Buffer size of the endorsement channel.
      evm_endorser_name: &evm_endorser_name
        type: str
        default: "{{ organization.name | lower }}"
        description:
          - Label for the embedded endorser.
      evm_crypto_name: &evm_crypto_name
        type: str
        default: "{{ organization.peer.name | default(inventory_hostname) }}"
        description:
          - Name of the enrolled peer identity backing the embedded endorser.
      evm_use_tls: &evm_use_tls
        type: bool
        default: false
        description:
          - Enroll a shared client TLS key pair for EVM, used when any connected orderer or the committer sidecar requires mTLS.
          - Set this to C(true) whenever any orderer router (from C(orderer_hosts)) or the committer sidecar (derived from C(committer_hosts)) has C(orderer_use_mtls) or C(committer_use_mtls) enabled; the TLS mode used on each individual connection is still derived from that host's own flags.
      evm_k8s_resource_name: &evm_k8s_resource_name
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - Kubernetes resource name used for the StatefulSet, Service, ConfigMap, Secret, optional NodePort Service, and PersistentVolumeClaim.
      evm_k8s_part_of: &evm_k8s_part_of
        type: str
        default: evm
        description:
          - Value for the Kubernetes C(app.kubernetes.io/part-of) label applied to EVM resources.
      evm_k8s_wait_timeout: &evm_k8s_wait_timeout
        type: int
        default: 120
        description:
          - StatefulSet rollout wait timeout in seconds.
      evm_k8s_fs_group: &evm_k8s_fs_group
        type: int
        default: 10001
        description:
          - Pod FSGroup used for mounted config, secrets, and data.
      evm_k8s_node_port: &evm_k8s_node_port
        type: int
        description:
          - Kubernetes NodePort value used by the external Service port.
          - Defining this variable enables the NodePort Service; the value is set as the static C(nodePort) in the Service spec.
          - "Example: C(30545)."
      evm_k8s_loadbalancer_expose_port: &evm_k8s_loadbalancer_expose_port
        type: bool
        default: false
        description:
          - Set to C(true) to create a LoadBalancer Service entry that exposes the JSON-RPC port externally.
          - When undefined or C(false), the JSON-RPC port is not included in the LoadBalancer Service.
      evm_openshift_route: &evm_openshift_route
        type: str
        description:
          - Specifies the OpenShift Route host for the JSON-RPC port.
          - "Example: C(fabric-x-evm.apps.example.com)."

  start:
    short_description: Start the Fabric-X EVM gateway
    description:
      - Start the EVM gateway and embedded endorser runtime selected by the deployment mode flags.
      - Container mode is the default, and Kubernetes mode applies Services, a PersistentVolumeClaim, and a StatefulSet.
      - The runtime consumes the rendered configuration and crypto material prepared by the config and crypto entry points.
    options:
      evm_use_container: *evm_use_container
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  stop:
    short_description: Stop the Fabric-X EVM gateway
    description:
      - Stop the active EVM container without removing configuration, crypto material, logs, or Kubernetes resources.
    options:
      evm_use_container: *evm_use_container
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  teardown:
    short_description: Remove runtime artifacts
    description:
      - Remove runtime resources for the selected EVM deployment mode.
      - Deletes the local container or Kubernetes workload resources while leaving generated config, crypto material, and fetched artifacts intact.
    options:
      evm_use_container: *evm_use_container
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  wipe:
    short_description: Remove all EVM data
    description:
      - Remove EVM runtime resources, generated configuration, crypto material, and persisted state from the host.
    options:
      evm_remote_data_dir: *evm_remote_data_dir
      remote_data_dir: *remote_data_dir

  fetch_logs:
    short_description: Collect runtime logs
    description:
      - Collect EVM gateway logs for the selected deployment mode.
    options:
      evm_use_container: *evm_use_container
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  ping:
    short_description: Check the JSON-RPC endpoint
    description:
      - Verify that the EVM gateway's JSON-RPC endpoint is reachable and answering for the configured chain.
      - Checks the TCP port, then asserts C(eth_chainId) matches C(evm_chain_id) and that C(eth_blockNumber) succeeds.
      - Because the gateway only opens its listener once its embedded endorser has synchronized with the committer sidecar, a successful C(eth_chainId) reply also proves Fabric-X connectivity.
      - Uses direct host access for container deployments and delegates to the Kubernetes ping task when C(evm_use_k8s) is enabled.
    options:
      evm_port: *evm_port
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  rpc_check:
    short_description: Assert the EVM JSON-RPC endpoint answers for the configured chain
    description:
      - Internal helper included with C(evm_ping_base_url) set by the caller.
      - Asserts C(eth_chainId) matches C(evm_chain_id) and that C(eth_blockNumber) succeeds.
    options:
      evm_chain_id: *evm_chain_id

  container/start:
    short_description: Start the container runtime
    description:
      - Start the EVM gateway as a local container with the rendered config directory mounted read-only and a read-write data directory for its persisted state.
      - Exposes the JSON-RPC port and waits for it to become reachable.
    options:
      evm_container_name: *evm_container_name
      evm_image: *evm_image
      evm_registry_endpoint: *evm_registry_endpoint
      evm_image_name: *evm_image_name
      evm_image_tag: *evm_image_tag
      remote_config_dir: *remote_config_dir
      evm_remote_config_dir: *evm_remote_config_dir
      evm_container_config_dir: *evm_container_config_dir
      evm_config_file: *evm_config_file
      remote_data_dir: *remote_data_dir
      evm_remote_data_dir: *evm_remote_data_dir
      evm_container_data_dir: *evm_container_data_dir
      evm_port: *evm_port

  container/stop:
    short_description: Stop the container runtime
    description:
      - Stop the local EVM container.
      - Preserves the container definition, mounted configuration, crypto material, and logs for later cleanup or collection.
    options:
      evm_container_name: *evm_container_name

  container/rm:
    short_description: Remove the container runtime
    description:
      - Remove the local EVM container runtime resources.
      - Leaves host-side generated configuration, crypto material, and persisted state under the remote config and data directories.
    options:
      evm_container_name: *evm_container_name

  container/fetch_logs:
    short_description: Fetch container logs
    description:
      - Collect logs from a containerized EVM runtime.
    options:
      evm_container_name: *evm_container_name

  config/transfer:
    short_description: Render and transfer the EVM gateway configuration
    description:
      - Render the EVM gateway configuration with the resolved orderer and committer sidecar connection details.
      - Transfers the committer sidecar and each orderer router's TLS CA certificates when their respective TLS modes are enabled.
      - For Kubernetes deployments, also publishes the rendered config and trusted CA bundles as a ConfigMap.
      - Fails when C(organization.namespaces) does not declare exactly one namespace, since the gateway can only serve a single Fabric-X application namespace.
    options:
      remote_config_dir: *remote_config_dir
      evm_remote_config_dir: *evm_remote_config_dir
      evm_container_config_dir: *evm_container_config_dir
      evm_container_data_dir: *evm_container_data_dir
      evm_config_file: *evm_config_file
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift
      evm_port: *evm_port
      evm_chain_id: *evm_chain_id
      evm_ns_version: *evm_ns_version
      evm_protocol: *evm_protocol
      evm_log_level: *evm_log_level
      evm_log_format: *evm_log_format
      evm_worker_count: *evm_worker_count
      evm_submitter_count: *evm_submitter_count
      evm_endorsement_chan_size: *evm_endorsement_chan_size
      evm_endorser_name: *evm_endorser_name
      organization: *organization
      channel_id: *channel_id
      committer_hosts: *committer_hosts
      orderer_router_hosts: *orderer_router_hosts
      fetched_artifacts_dir: *fetched_artifacts_dir

  config/rm:
    short_description: Remove rendered configuration
    description:
      - Remove host-side rendered EVM configuration.
      - Also removes the Kubernetes ConfigMap when Kubernetes deployment mode is enabled.
    options:
      evm_remote_config_dir: *evm_remote_config_dir
      remote_config_dir: *remote_config_dir
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  crypto/setup:
    short_description: Prepare crypto material
    description:
      - Enrolls the peer identity backing the embedded endorser, each declared user identity, and (when any connected orderer or the committer sidecar requires mTLS) a shared client TLS key pair.
      - Selects C(cryptogen) or Fabric CA based on C(organization.fabric_ca_host).
      - Then publishes Kubernetes Secret material when Kubernetes mode is enabled.
    options:
      organization: *organization
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  crypto/cryptogen/transfer:
    short_description: Transfer cryptogen-generated crypto material for EVM
    description:
      - Transfers the peer MSP, each user MSP, and (when C(evm_use_tls) is C(true)) TLS key material generated by C(cryptogen) for the EVM identities named by C(organization.peer.name) and C(organization.users).
    options:
      organization: *organization
      cryptogen_artifacts_dir: *cryptogen_artifacts_dir
      evm_remote_config_dir: *evm_remote_config_dir
      remote_config_dir: *remote_config_dir
      evm_crypto_name: *evm_crypto_name
      evm_use_tls: *evm_use_tls

  crypto/fabric_ca/enroll:
    short_description: Enroll EVM identities with Fabric CA
    description:
      - Enrolls the peer identity, each user identity, and (when C(evm_use_tls) is C(true)) the client TLS identity through Fabric CA.
      - Uses C(actual_host) in the CSR SAN list.
    options:
      organization: *organization
      evm_remote_config_dir: *evm_remote_config_dir
      remote_config_dir: *remote_config_dir
      evm_crypto_name: *evm_crypto_name
      evm_use_tls: *evm_use_tls
      actual_host: *actual_host
      fetched_artifacts_dir: *fetched_artifacts_dir

  crypto/fetch:
    short_description: Fetch EVM identity certificates
    description:
      - Fetches the EVM peer and user sign certificates so C(fxconfig) can build namespace endorsement policies that reference them.
      - Also fetches the client TLS CA certificate when C(evm_use_tls) is C(true), so other Fabric-X components can be configured to trust EVM as an mTLS client.
    options:
      organization: *organization
      evm_remote_config_dir: *evm_remote_config_dir
      remote_config_dir: *remote_config_dir
      fetched_artifacts_dir: *fetched_artifacts_dir
      evm_crypto_name: *evm_crypto_name
      evm_use_tls: *evm_use_tls

  crypto/rm:
    short_description: Remove crypto material
    description:
      - Remove EVM MSP and TLS artifacts from the host config directory.
      - Also removes the Kubernetes Secret when Kubernetes deployment mode is enabled.
    options:
      evm_remote_config_dir: *evm_remote_config_dir
      remote_config_dir: *remote_config_dir
      evm_use_k8s: *evm_use_k8s
      evm_use_openshift: *evm_use_openshift

  k8s/start:
    short_description: Start the Kubernetes deployment
    description:
      - Create or update Kubernetes resources for the EVM gateway.
      - Ensures the namespace exists, applies the Service, optional NodePort and LoadBalancer Services, a PersistentVolumeClaim template, and the StatefulSet, mounting the generated ConfigMap and Secret artifacts into the pod.
    options:
      evm_image: *evm_image
      evm_registry_endpoint: *evm_registry_endpoint
      evm_image_name: *evm_image_name
      evm_image_tag: *evm_image_tag
      evm_container_config_dir: *evm_container_config_dir
      evm_config_file: *evm_config_file
      evm_container_data_dir: *evm_container_data_dir
      evm_k8s_wait_timeout: *evm_k8s_wait_timeout
      evm_k8s_fs_group: *evm_k8s_fs_group
      k8s_namespace: *k8s_namespace
      evm_k8s_resource_name: *evm_k8s_resource_name
      evm_k8s_part_of: *evm_k8s_part_of
      k8s_image_pull_secret: *k8s_image_pull_secret
      evm_port: *evm_port
      evm_k8s_node_port: *evm_k8s_node_port
      evm_k8s_loadbalancer_expose_port: *evm_k8s_loadbalancer_expose_port
      organization: *organization
      evm_crypto_name: *evm_crypto_name
      evm_use_tls: *evm_use_tls
      committer_hosts: *committer_hosts
      orderer_router_hosts: *orderer_router_hosts
      k8s_resources: *k8s_resources
      k8s_storage_class: *k8s_storage_class
      k8s_storage_size: *k8s_storage_size
      k8s_readiness_probe_initial_delay_seconds: *k8s_readiness_probe_initial_delay_seconds
      k8s_readiness_probe_period_seconds: *k8s_readiness_probe_period_seconds
      k8s_readiness_probe_timeout_seconds: *k8s_readiness_probe_timeout_seconds
      k8s_readiness_probe_failure_threshold: *k8s_readiness_probe_failure_threshold
      k8s_liveness_probe_initial_delay_seconds: *k8s_liveness_probe_initial_delay_seconds
      k8s_liveness_probe_period_seconds: *k8s_liveness_probe_period_seconds
      k8s_liveness_probe_timeout_seconds: *k8s_liveness_probe_timeout_seconds
      k8s_liveness_probe_failure_threshold: *k8s_liveness_probe_failure_threshold

  k8s/ping:
    short_description: Check that the EVM Kubernetes services are reachable
    description:
      - Probes the configured NodePort value and LoadBalancer-exposed service port for external reachability, then asserts C(eth_chainId) and C(eth_blockNumber) succeed over that address.
    options:
      evm_port: *evm_port
      evm_k8s_node_port: *evm_k8s_node_port
      evm_k8s_loadbalancer_expose_port: *evm_k8s_loadbalancer_expose_port

  k8s/rm:
    short_description: Remove Kubernetes resources
    description:
      - Remove the Kubernetes StatefulSet and Services created for the EVM gateway.
      - Does not remove the ConfigMap, Secret, or PersistentVolumeClaim; use the Kubernetes config and crypto remove entry points, or C(wipe), for those generated artifacts.
    options:
      k8s_namespace: *k8s_namespace
      evm_k8s_resource_name: *evm_k8s_resource_name
      evm_k8s_node_port: *evm_k8s_node_port
      evm_k8s_loadbalancer_expose_port: *evm_k8s_loadbalancer_expose_port

  k8s/fetch_logs:
    short_description: Fetch pod logs
    description:
