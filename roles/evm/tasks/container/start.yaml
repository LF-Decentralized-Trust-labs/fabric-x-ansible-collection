- name: Ensure the EVM data directory exists
  ansible.builtin.file:
    path: "{{ evm_remote_data_dir }}"
    state: directory
    mode: "0o755"

- name: Start EVM container
  vars:
    container_name: "{{ evm_container_name }}"
    container_image: "{{ evm_image }}"
    container_command: "start --config={{ evm_container_config_dir }}/{{ evm_config_file }}"
    # The image is FROM scratch (no shell, no wget/curl/nc); fxevm ships its
    # own healthcheck subcommand and the Dockerfile already declares this as
    # the exec-form HEALTHCHECK. List form forces exec form on both engines.
    container_healthcheck_test:
      - CMD
      - fxevm
      - healthcheck
      - "--addr=localhost:{{ evm_port }}"
    container_ports:
      - "{{ evm_port }}:{{ evm_port }}"
    container_volumes:
      - "{{ evm_remote_config_dir }}:{{ evm_container_config_dir }}:z,ro"
      - "{{ evm_remote_data_dir }}:{{ evm_container_data_dir }}:z"
    container_run_as_host_user: true
    container_wait_until_running: true
    container_wait_port: "{{ evm_port }}"
    container_wait_timeout: 120
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
