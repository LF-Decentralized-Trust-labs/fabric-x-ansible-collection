# =========================
# Peer MSP
# =========================
- name: Ensure the EVM config directory exists
  ansible.builtin.file:
    path: "{{ evm_remote_config_dir }}"
    state: directory
    mode: "0o755"

- name: Transfer the peer MSP crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ evm_crypto_name }}.{{ organization.domain }}/msp"
    dest: "{{ evm_remote_config_dir }}"

# =========================
# User MSP
# =========================
- name: Ensure the EVM users config directory exists
  ansible.builtin.file:
    path: "{{ evm_remote_config_dir }}/users"
    state: directory
    mode: "0o755"

- name: Transfer the EVM user crypto material
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/users/{{ organization.user.name }}@{{ organization.domain }}"
    dest: "{{ evm_remote_config_dir }}/users"

# =========================
# TLS
# =========================
- name: Transfer the client TLS crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ evm_crypto_name }}.{{ organization.domain }}/tls"
    dest: "{{ evm_remote_config_dir }}"
  when:
    - evm_use_tls
