# =========================
# Namespace
# =========================
- name: Ensure Kubernetes namespace exists for EVM
  ansible.builtin.include_role:
    name: hyperledger.fabricx.k8s
    tasks_from: namespace/create

# =========================
# Apply Secret
# =========================
- name: Apply EVM Secret
  vars:
    evm_k8s_msp_cacert_path: "{{ evm_remote_config_dir }}/msp/cacerts/ca.{{ organization.domain }}-cert.pem"
    evm_k8s_msp_keystore_path: "{{ evm_remote_config_dir }}/msp/keystore/priv_sk"
    evm_k8s_msp_signcert_path: "{{ evm_remote_config_dir }}/msp/signcerts/{{ evm_crypto_name }}.{{ organization.domain }}-cert.pem"
    evm_k8s_msp_config_path: "{{ evm_remote_config_dir }}/msp/config.yaml"
    evm_k8s_tls_server_key_path: "{{ evm_remote_config_dir }}/tls/server.key"
    evm_k8s_tls_server_crt_path: "{{ evm_remote_config_dir }}/tls/server.crt"
    evm_k8s_tls_ca_crt_path: "{{ evm_remote_config_dir }}/tls/ca.crt"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ k8s_namespace | default('default') }}"
    template:
      path: k8s/secret.yaml.j2
