- name: Delete EVM OpenShift Route
  vars:
    openshift_route_name: "{{ evm_k8s_resource_name }}-rest"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.openshift
    tasks_from: route/rm
  when: evm_openshift_route is defined

- name: Remove EVM workload using generic k8s flow
  ansible.builtin.include_role:
    name: hyperledger.fabricx.evm
    tasks_from: k8s/rm
