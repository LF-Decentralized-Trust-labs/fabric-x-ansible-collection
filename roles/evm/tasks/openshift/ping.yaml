- name: Check that the EVM OpenShift route is reachable
  vars:
    openshift_route_host: "{{ evm_openshift_route }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.openshift
    tasks_from: route/ping
  when: evm_openshift_route is defined

- name: Check the EVM JSON-RPC endpoint via OpenShift route
  vars:
    evm_ping_base_url: "http://{{ evm_openshift_route }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.evm
    tasks_from: rpc_check
  when: evm_openshift_route is defined

- name: Check that the EVM Kubernetes services are reachable
  ansible.builtin.include_role:
    name: hyperledger.fabricx.evm
    tasks_from: k8s/ping
