# =========================
# MSP certs
# =========================
- name: Ensure the organizations directories exist
  ansible.builtin.file:
    path: "{{ fetched_artifacts_dir }}/crypto/organizations/{{ current_org_info.domain }}"
    state: directory
    mode: "0o755"
  loop: "{{ cryptogen_orgs_by_domain.values() | list }}"
  loop_control:
    loop_var: current_org_info
    label: "{{ current_org_info.domain }}"

- name: Fetch organization MSP directory
  ansible.posix.synchronize:
    src: "{{ cryptogen_output_dir }}/organizations/{{ current_org_info.domain }}/msp"
    dest: "{{ fetched_artifacts_dir }}/crypto/organizations/{{ current_org_info.domain }}"
  loop: "{{ cryptogen_orgs_by_domain.values() | list }}"
  loop_control:
    loop_var: current_org_info
    label: "{{ current_org_info.domain }}"

# =========================
# User MSP and TLS
# =========================
# Each organization's declared users are generated by cryptogen alongside its
# nodes, so they are copied here too, whichever role consumes them later.
- name: Ensure the organization user directories exist
  ansible.builtin.file:
    path: "{{ fetched_artifacts_dir }}/crypto/organizations/{{ current_user_entry.0.value.domain }}/users"
    state: directory
    mode: "0o755"
  loop: "{{ cryptogen_orgs_by_domain | dict2items | subelements('value.users', skip_missing=true) }}"
  loop_control:
    loop_var: current_user_entry
    label: "{{ current_user_entry.1.name }}"

- name: Fetch the organization user MSP and TLS directories
  ansible.posix.synchronize:
    src: "{{ cryptogen_output_dir }}/organizations/{{ current_user_entry.0.value.domain }}/users/{{ current_user_entry.1.name }}@{{ current_user_entry.0.value.domain }}"
    dest: "{{ fetched_artifacts_dir }}/crypto/organizations/{{ current_user_entry.0.value.domain }}/users"
  loop: "{{ cryptogen_orgs_by_domain | dict2items | subelements('value.users', skip_missing=true) }}"
  loop_control:
    loop_var: current_user_entry
    label: "{{ current_user_entry.1.name }}"
