- name: Create config build output directory
  ansible.builtin.file:
    path: "{{ cryptogen_artifacts_dir }}"
    state: directory
    mode: "0o755"

# We gather facts in order to get the IP addresses of the
# nodes and generate TLS certificates which contain such IPs.
- name: Gather Hyperledger Fabric-X node facts
  ansible.builtin.setup:
  delegate_to: "{{ current_node.name }}"
  delegate_facts: true
  loop: >-
    {{
      cryptogen_orgs_by_domain.values()
      | selectattr('nodes', 'defined')
      | map(attribute='nodes')
      | flatten
    }}
  loop_control:
    loop_var: current_node
    label: "{{ current_node.name }}"
  when:
    - hostvars[current_node.name].ansible_facts.all_ipv4_addresses is undefined

- name: Create crypto-config.yaml from template
  ansible.builtin.template:
    src: crypto-config.yaml.j2
    dest: "{{ cryptogen_artifacts_dir }}/{{ cryptogen_config_file }}"
    mode: "0o644"
