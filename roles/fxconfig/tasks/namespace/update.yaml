- name: Update namespace with fxconfig binary
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxconfig
    tasks_from: bin/namespace/update
  when:
    - fxconfig_use_bin

- name: Update namespace with fxconfig container
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxconfig
    tasks_from: container/namespace/update
  when:
    - not fxconfig_use_bin
