- name: Retrieve AWX admin password secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ k8s_namespace | default('default') }}"
    name: "{{ awx_admin_password_secret_name }}"
  register: awx_admin_password_secret
  retries: "{{ awx_admin_password_retries }}"
  delay: "{{ awx_admin_password_delay }}"
  until:
    - awx_admin_password_secret.resources | length > 0
    - >-
      not awx_admin_password_require_password
      or ("password" in (awx_admin_password_secret.resources[0].data | default({})))
  failed_when:
    - awx_admin_password_secret.resources | length == 0
    - not awx_admin_password_require_password
  no_log: true

- name: Set AWX admin password fact
  ansible.builtin.set_fact:
    awx_admin_password: "{{ awx_admin_password_secret.resources[0].data.password | default('') | b64decode }}"
  no_log: true
