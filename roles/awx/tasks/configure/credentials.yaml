- name: Ensure AWX credentials exist
  awx.awx.credential:
    name: "{{ current_awx_credential.name }}"
    credential_type: "{{ current_awx_credential.credential_type }}"
    organization: "{{ current_awx_credential.organization | default(awx_config_organization_name) }}"
    inputs: "{{ current_awx_credential.inputs | default({}) }}"
    state: present
  loop: "{{ awx_config_credentials }}"
  loop_control:
    loop_var: current_awx_credential
    label: "{{ current_awx_credential.name }}"
  no_log: true
