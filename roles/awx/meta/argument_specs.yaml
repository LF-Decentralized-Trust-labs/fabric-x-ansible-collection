---
argument_specs:
  role-options:
    short_description: Shared option catalog for awx role entry points
    options:
      awx_use_k8s: &awx_use_k8s
        type: bool
        default: false
        description:
          - "Deploy AWX on Kubernetes"
      awx_use_openshift: &awx_use_openshift
        type: bool
        default: false
        description:
          - "Deploy AWX on OpenShift"
      awx_use_tls: &awx_use_tls
        type: bool
        default: true
        description:
          - "Expose AWX routes with TLS"
      k8s_namespace: &k8s_namespace
        type: str
        description:
          - "Kubernetes namespace for AWX resources"
      k8s_storage_class: &k8s_storage_class
        type: str
        description:
          - "Kubernetes storage class for AWX persistent volumes"
      remote_config_dir: &remote_config_dir
        type: path
        description:
          - "Directory for rendered remote configuration artifacts"
      awx_k8s_operator_kustomize_dir: &awx_k8s_operator_kustomize_dir
        type: path
        default: "{{ remote_config_dir }}/awx-operator"
        description:
          - "Directory used to render the AWX operator kustomization"
      awx_k8s_wait_timeout: &awx_k8s_wait_timeout
        type: int
        default: 300
        description:
          - "Timeout in seconds for Kubernetes resource apply operations"
      awx_k8s_node_port: &awx_k8s_node_port
        type: int
        description:
          - "Kubernetes NodePort for AWX external access"
      awx_k8s_ready_retries: &awx_k8s_ready_retries
        type: int
        default: 60
        description:
          - "Readiness polling retry count"
      awx_k8s_ready_delay: &awx_k8s_ready_delay
        type: int
        default: 10
        description:
          - "Readiness polling delay in seconds"
      awx_operator_version: &awx_operator_version
        type: str
        default: "2.19.1"
        description:
          - "AWX Operator version Git ref"
      awx_kube_rbac_proxy_image: &awx_kube_rbac_proxy_image
        type: str
        default: "quay.io/brancz/kube-rbac-proxy"
        description:
          - "Replacement image repository for the AWX Operator kube-rbac-proxy sidecar"
      awx_kube_rbac_proxy_version: &awx_kube_rbac_proxy_version
        type: str
        default: "v0.15.0"
        description:
          - "Replacement image tag for the AWX Operator kube-rbac-proxy sidecar"
      awx_postgres_size: &awx_postgres_size
        type: str
        default: "8Gi"
        description:
          - "Size of the PostgreSQL persistent volume"
      awx_projects_size: &awx_projects_size
        type: str
        default: "1Gi"
        description:
          - "Size of the projects persistent volume"
      awx_postgres_security_context_settings: &awx_postgres_security_context_settings
        type: dict
        description:
          - "Security context settings applied to the AWX Operator-managed PostgreSQL container (not the pod)."
          - "Example: C({'allowPrivilegeEscalation': False, 'capabilities': {'drop': ['ALL']}, 'seccompProfile': {'type': 'RuntimeDefault'}})."
      awx_postgres_fix_pvc_permissions: &awx_postgres_fix_pvc_permissions
        type: bool
        default: false
        description:
          - "Enable ownership workarounds for storage backends that don't apply correct PVC permissions on mount."
          - "Triggers the AWX Operator's own init-container-based fix (postgres_data_volume_init) for the PostgreSQL PVC, and this role's own pre-create-and-chown fix for the AWXBackup PVC (the Operator has no equivalent lever for that one)."
      awx_pvc_permissions_image: &awx_pvc_permissions_image
        type: str
        default: "quay.io/sclorg/postgresql-15-c9s:latest"
        description:
          - "Container image used by AWX PVC permissions fix pods"
      awx_postgres_run_as_user: &awx_postgres_run_as_user
        type: int
        default: 26
        description:
          - "User ID expected to own the AWX PostgreSQL data directory"
      awx_backup_pvc_name: &awx_backup_pvc_name
        type: str
        default: "awx-backup-claim"
        description:
          - "Name of the PVC used by AWXBackup when pre-creating the backup volume"
      awx_backup_pvc_size: &awx_backup_pvc_size
        type: str
        default: "8Gi"
        description:
          - "Size of the AWXBackup PVC when pre-creating the backup volume"
      k8s_resources: &k8s_resources
        type: dict
        description:
          - "Optional Kubernetes container resource requests and limits, applied identically to both the AWX web and task pods."
          - "Example: C({'requests': {'memory': '512Mi', 'cpu': '250m'}, 'limits': {'memory': '1Gi', 'cpu': '1000m'}})."
      awx_openshift_route: &awx_openshift_route
        type: str
        description:
          - "OpenShift route host for AWX"
      awx_host: &awx_host
        type: str
        default: "{{ inventory_hostname }}"
        description:
          - "Inventory host whose AWX effective address should be computed"
      awx_backup_name: &awx_backup_name
        type: str
        default: "awx-backup"
        description:
          - "Name of AWX backup"
      awx_restore_name: &awx_restore_name
        type: str
        default: "awx-restore"
        description:
          - "Name of AWX restore instance"
      awx_restore_openshift_route: &awx_restore_openshift_route
        type: str
        description:
          - "OpenShift route host for the restored AWX instance"
      awx_new_admin_credential: &awx_new_admin_credential
        type: str
        description:
          - "New admin credential for AWX restore, used only as a fallback if the restored instance's admin-password Secret is missing a password."
          - "Has no default; supply a vaulted or otherwise secret-managed value. Only required when that fallback path is actually reached."
      awx_admin_password_secret_name: &awx_admin_password_secret_name
        type: str
        default: "awx-admin-password"
        description:
          - "Name of the Secret holding the AWX admin password."
      awx_admin_password_retries: &awx_admin_password_retries
        type: int
        default: "{{ awx_k8s_ready_retries }}"
        description:
          - "Readiness polling retry count while waiting for the admin password Secret."
      awx_admin_password_delay: &awx_admin_password_delay
        type: int
        default: "{{ awx_k8s_ready_delay }}"
        description:
          - "Readiness polling delay in seconds while waiting for the admin password Secret."
      awx_admin_password_require_password: &awx_admin_password_require_password
        type: bool
        default: true
        description:
          - "Wait for the C(password) key to appear in the Secret, not just for the Secret to exist."
          - "Disabled during restore, where a missing C(password) key is a legitimate outcome handled by a fallback reset rather than a wait condition."
      awx_config_controller_username: &awx_config_controller_username
        type: str
        default: "admin"
        description:
          - "AWX/Controller username used to authenticate configuration requests."
      awx_config_validate_certs: &awx_config_validate_certs
        type: bool
        default: false
        description:
          - "Validate TLS certificates when talking to the AWX/Controller API."
          - "Left disabled by default because the AWX Operator's default web certificate is self-signed."
      awx_config_organization_name: &awx_config_organization_name
        type: str
        default: "Fabric-X"
        description:
          - "Name of the AWX organization that owns the Fabric-X examples project, credentials, inventories, and job templates."
      awx_config_project_name: &awx_config_project_name
        type: str
        default: "Fabric-X Examples"
        description:
          - "Name of the AWX project synced from C(awx_config_project_scm_url)."
      awx_config_project_scm_type: &awx_config_project_scm_type
        type: str
        default: "git"
        description:
          - "SCM type used for the AWX project."
      awx_config_project_scm_url: &awx_config_project_scm_url
        type: str
        default: "https://github.com/LF-Decentralized-Trust-labs/fabric-x-ansible-collection.git"
        description:
          - "Git URL of the repository synced into the AWX project."
          - "Point this at an internal/enterprise mirror (for example a github.ibm.com repository) together with C(awx_config_project_scm_credential) when the public repository is not reachable from AWX."
      awx_config_project_scm_branch: &awx_config_project_scm_branch
        type: str
        default: "main"
        description:
          - "Git branch, tag, or commit synced into the AWX project."
      awx_config_project_scm_credential: &awx_config_project_scm_credential
        type: str
        description:
          - "Name of a Source Control credential (see C(awx_config_credentials)) to attach to the project."
          - "Required for private or enterprise repositories such as github.ibm.com; leave unset for the public repository."
      awx_config_project_scm_update_on_launch: &awx_config_project_scm_update_on_launch
        type: bool
        default: true
        description:
          - "Refresh the project from its SCM source before launching a job that uses it."
      awx_config_project_wait: &awx_config_project_wait
        type: bool
        default: true
        description:
          - "Wait for the project's initial SCM sync to finish before creating inventories and job templates against it."
      awx_config_project_wait_timeout: &awx_config_project_wait_timeout
        type: int
        default: 120
        description:
          - "Seconds to wait for the project's initial SCM sync (see C(awx_config_project_wait))."
      awx_config_credentials: &awx_config_credentials
        type: list
        elements: dict
        description:
          - "Credential objects created before the project and job templates. Each item is passed to M(awx.awx.credential) (C(name), C(credential_type), optional C(organization), optional C(inputs))."
          - "Use this for Source Control tokens (private/enterprise repositories) and container-registry credentials. Machine/SSH credentials used to reach target hosts are intentionally out of scope: create those manually in the AWX UI so private key material is never read or transmitted by this role."
          - "Example: C([{'name': 'GHE Fabric-X Token', 'credential_type': 'Source Control', 'inputs': {'username': 'svc-fabricx', 'password': 'REPLACE_WITH_VAULTED_TOKEN'}}])."
      awx_config_inventories: &awx_config_inventories
        type: list
        elements: dict
        default:
          - name: "Fabric-X - local"
            source_path: "examples/inventory/local/fabric-x.yaml"
          - name: "Fabric-X - k8s"
            source_path: "examples/inventory/k8s/fabric-x.yaml"
          - name: "Fabric-X - openshift"
            source_path: "examples/inventory/openshift/fabric-x.yaml"
          - name: "Fabric-X - distributed"
            source_path: "examples/inventory/distributed/fabric-x.yaml"
        description:
          - "Inventories created from the AWX project, one per C(examples/inventory) family. Each item is passed to M(awx.awx.inventory) and M(awx.awx.inventory_source) (C(name), optional C(description), C(source_path), optional C(credential) name of a machine/SSH credential created manually in the AWX UI)."
          - "This list is not discovered automatically; it is kept in sync by hand with C(examples/inventory). Add, rename, or remove an entry here when a family is added, renamed, or removed there."
      awx_config_job_templates: &awx_config_job_templates
        type: list
        elements: dict
        default:
          - name: "Fabric-X - Binaries"
            playbook: "examples/playbooks/10-binaries.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Generate Crypto"
            playbook: "examples/playbooks/20-generate-crypto.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Build Genesis Block"
            playbook: "examples/playbooks/21-build-genesis-block.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Configs"
            playbook: "examples/playbooks/30-configs.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Start"
            playbook: "examples/playbooks/40-start.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Init"
            playbook: "examples/playbooks/41-init.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Stop"
            playbook: "examples/playbooks/50-stop.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Teardown"
            playbook: "examples/playbooks/60-teardown.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Ping"
            playbook: "examples/playbooks/70-ping.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Get Metrics"
            playbook: "examples/playbooks/93-get-metrics.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Fetch Crypto"
            playbook: "examples/playbooks/95-fetch-crypto.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Fetch Logs"
            playbook: "examples/playbooks/96-fetch-logs.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Wipe"
            playbook: "examples/playbooks/100-wipe.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Hard Wipe"
            playbook: "examples/playbooks/110-hard-wipe.yaml"
            inventory: "Fabric-X - k8s"
          - name: "Fabric-X - Run Command"
            playbook: "examples/playbooks/999-run-command.yaml"
            inventory: "Fabric-X - k8s"
        description:
          - "Job templates created for the numbered example playbooks under C(examples/playbooks/). Each item is passed to M(awx.awx.job_template) (C(name), C(playbook), optional C(inventory), optional C(extra_vars), optional C(credentials))."
          - "C(ask_inventory_on_launch) and C(ask_variables_on_launch) are always enabled so operators can pick a different example family or override C(extra_vars) such as C(target_hosts) at launch time, mirroring the C(TARGET_HOSTS) override supported by the repository Makefile."
          - "This list is not discovered automatically; it is kept in sync by hand with C(examples/playbooks). Add, rename, or remove an entry here when a numbered playbook is added, renamed, or removed there."
  start:
    short_description: Start AWX
    options:
      awx_use_k8s: *awx_use_k8s
      awx_use_openshift: *awx_use_openshift

  teardown:
    short_description: Teardown AWX
    options:
      awx_use_k8s: *awx_use_k8s
      awx_use_openshift: *awx_use_openshift

  wipe:
    short_description: Wipe AWX
    options: {}

  data/rm:
    short_description: Remove AWX persistent volume claims
    options:
      awx_use_k8s: *awx_use_k8s
      awx_use_openshift: *awx_use_openshift

  crypto/rm:
    short_description: Remove AWX Secrets
    options:
      awx_use_k8s: *awx_use_k8s
      awx_use_openshift: *awx_use_openshift

  config/rm:
    short_description: Remove AWX ConfigMaps and Operator
    options:
      awx_use_k8s: *awx_use_k8s
      awx_use_openshift: *awx_use_openshift

  k8s/start:
    short_description: Start AWX on Kubernetes
    options:
      k8s_namespace: *k8s_namespace
      k8s_storage_class: *k8s_storage_class
      remote_config_dir: *remote_config_dir
      awx_k8s_operator_kustomize_dir: *awx_k8s_operator_kustomize_dir
      awx_k8s_wait_timeout: *awx_k8s_wait_timeout
      awx_k8s_node_port: *awx_k8s_node_port
      awx_k8s_ready_retries: *awx_k8s_ready_retries
      awx_k8s_ready_delay: *awx_k8s_ready_delay
      awx_operator_version: *awx_operator_version
      awx_kube_rbac_proxy_image: *awx_kube_rbac_proxy_image
      awx_kube_rbac_proxy_version: *awx_kube_rbac_proxy_version
      awx_postgres_size: *awx_postgres_size
      awx_projects_size: *awx_projects_size
      awx_postgres_security_context_settings: *awx_postgres_security_context_settings
      awx_postgres_fix_pvc_permissions: *awx_postgres_fix_pvc_permissions
      k8s_resources: *k8s_resources
      awx_use_openshift: *awx_use_openshift

  effective_address:
    short_description: Compute the effective AWX web address
    options:
      awx_host: *awx_host

  get_admin_password:
    short_description: Retrieve and decode the AWX admin password Secret
    options:
      k8s_namespace: *k8s_namespace
      awx_admin_password_secret_name: *awx_admin_password_secret_name
      awx_admin_password_retries: *awx_admin_password_retries
      awx_admin_password_delay: *awx_admin_password_delay
      awx_admin_password_require_password: *awx_admin_password_require_password

  k8s/rm:
    short_description: Remove AWX Kubernetes resources
    options:
      k8s_namespace: *k8s_namespace
      awx_k8s_wait_timeout: *awx_k8s_wait_timeout

  k8s/data/rm:
    short_description: Remove AWX persistent volume claims
    options:
      k8s_namespace: *k8s_namespace
      awx_backup_pvc_name: *awx_backup_pvc_name

  k8s/crypto/rm:
    short_description: Remove AWX Secrets
    options:
      k8s_namespace: *k8s_namespace

  k8s/config/rm:
    short_description: Remove AWX ConfigMaps and Operator
    options:
      k8s_namespace: *k8s_namespace
      remote_config_dir: *remote_config_dir
      awx_k8s_operator_kustomize_dir: *awx_k8s_operator_kustomize_dir

  k8s/resources/fix_backup_pvc:
    short_description: Fix AWXBackup PVC ownership
    options:
      k8s_namespace: *k8s_namespace
      k8s_storage_class: *k8s_storage_class
      awx_k8s_wait_timeout: *awx_k8s_wait_timeout
      awx_k8s_ready_retries: *awx_k8s_ready_retries
      awx_k8s_ready_delay: *awx_k8s_ready_delay
      awx_backup_pvc_name: *awx_backup_pvc_name
      awx_backup_pvc_size: *awx_backup_pvc_size
      awx_pvc_permissions_image: *awx_pvc_permissions_image
      awx_postgres_run_as_user: *awx_postgres_run_as_user

  openshift/start:
    short_description: Start AWX on OpenShift
    options:
      awx_use_tls: *awx_use_tls
      awx_openshift_route: *awx_openshift_route

  openshift/rm:
    short_description: Remove AWX OpenShift resources
    options:
      awx_openshift_route: *awx_openshift_route

  openshift/fix_postgres_pvc:
    short_description: Fix AWX PostgreSQL PVC ownership on OpenShift
    options:
      k8s_namespace: *k8s_namespace
      awx_k8s_wait_timeout: *awx_k8s_wait_timeout
      awx_k8s_ready_retries: *awx_k8s_ready_retries
      awx_k8s_ready_delay: *awx_k8s_ready_delay
      awx_pvc_permissions_image: *awx_pvc_permissions_image
      awx_postgres_run_as_user: *awx_postgres_run_as_user

  backup:
    short_description: Backup AWX instance
    options:
      k8s_namespace: *k8s_namespace
      awx_backup_name: *awx_backup_name
      awx_postgres_fix_pvc_permissions: *awx_postgres_fix_pvc_permissions
      awx_backup_pvc_name: *awx_backup_pvc_name

  restore:
    short_description: Restore AWX instance
    options:
      k8s_namespace: *k8s_namespace
      awx_use_openshift: *awx_use_openshift
      awx_use_tls: *awx_use_tls
      awx_backup_name: *awx_backup_name
      awx_restore_name: *awx_restore_name
      awx_restore_openshift_route: *awx_restore_openshift_route
      awx_new_admin_credential: *awx_new_admin_credential
      awx_k8s_wait_timeout: *awx_k8s_wait_timeout

  configure:
    short_description: Populate a running AWX with the Fabric-X examples project, inventories, and job templates
    options:
      awx_config_controller_username: *awx_config_controller_username
      awx_config_validate_certs: *awx_config_validate_certs
      awx_config_credentials: *awx_config_credentials
      awx_config_inventories: *awx_config_inventories
      awx_config_job_templates: *awx_config_job_templates

  configure/organization:
    short_description: Ensure the AWX organization exists
    options:
      awx_config_organization_name: *awx_config_organization_name

  configure/credentials:
    short_description: Ensure AWX credentials exist
    options:
      awx_config_credentials: *awx_config_credentials
      awx_config_organization_name: *awx_config_organization_name

  configure/project:
    short_description: Ensure the AWX Fabric-X examples project exists
    options:
      awx_config_organization_name: *awx_config_organization_name
      awx_config_project_name: *awx_config_project_name
      awx_config_project_scm_type: *awx_config_project_scm_type
      awx_config_project_scm_url: *awx_config_project_scm_url
      awx_config_project_scm_branch: *awx_config_project_scm_branch
      awx_config_project_scm_credential: *awx_config_project_scm_credential
      awx_config_project_scm_update_on_launch: *awx_config_project_scm_update_on_launch
      awx_config_project_wait: *awx_config_project_wait
      awx_config_project_wait_timeout: *awx_config_project_wait_timeout

  configure/inventories:
    short_description: Ensure AWX inventories and their SCM inventory sources exist
    options:
      awx_config_organization_name: *awx_config_organization_name
      awx_config_project_name: *awx_config_project_name
      awx_config_inventories: *awx_config_inventories

  configure/job_templates:
    short_description: Ensure AWX job templates for the numbered example playbooks exist
    options:
      awx_config_organization_name: *awx_config_organization_name
      awx_config_project_name: *awx_config_project_name
      awx_config_job_templates: *awx_config_job_templates
