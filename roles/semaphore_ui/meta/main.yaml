---
galaxy_info:
  author: IBM
  description: >-
    Installs and runs Semaphore UI as a binary so operators can launch this collection's
    playbooks and inventories from a web UI with a live view of progress.
    Semaphore runs C(ansible-playbook) as a local subprocess on its own host, so that host
    is a persistent control node, matching the collection's fetch/distribute crypto model.
    The role also seeds a Semaphore project from the repository already on disk: one
    repository, one inventory per supported example family, and one task template per
    supported example playbook.
  license: Apache-2.0
  min_ansible_version: "2.17.0"
  platforms:
    - name: Ubuntu
      versions:
        - all
    - name: EL
      versions:
        - all
    - name: MacOSX
      versions:
        - all

dependencies: []
