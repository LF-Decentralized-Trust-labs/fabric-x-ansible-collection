---
argument_specs:
  role-options:
    short_description: Shared option catalog for Semaphore UI role entry points
    options:
      remote_node_dir: &remote_node_dir
        type: path
        description:
          - "Base directory on the managed host under which the Semaphore UI binary is installed."
          - "Example: C(/var/lib/fabricx)."
      remote_config_dir: &remote_config_dir
        type: path
        description:
          - "Base directory on the managed host for C(semaphore_ui_remote_config_dir)."
          - "Example: C(/var/lib/fabricx/config)."
      remote_data_dir: &remote_data_dir
        type: path
        description:
          - "Base directory on the managed host for C(semaphore_ui_remote_data_dir)."
          - "Example: C(/var/lib/fabricx/data)."
      project_dir: &project_dir
        type: path
        description:
          - "Project root directory on the managed host. Seeded as the Semaphore UI repository's absolute path, since it is a C(local) repository that Semaphore UI runs in place rather than cloning, so generated artifacts (for example C(out/control-node)) persist across runs."
          - "Example: C(/path/to/hyperledger/fabricx)."
      actual_host: &actual_host
        type: str
        required: true
        description:
          - Real machine host.
          - "Example: C(myvpc.cloud.ibm.com)."
      semaphore_ui_version: &semaphore_ui_version
        type: str
        default: "2.18.28"
        description:
          - "Semaphore UI release version to install."
      semaphore_ui_edition: &semaphore_ui_edition
        type: str
        default: "semaphore_community"
        description:
          - "Selects the release asset prefix. C(semaphore_community) is the MIT-licensed open-source build; C(semaphore) is the commercially-licensed build."
          - "Example: C(semaphore)."
      semaphore_ui_bin_name: &semaphore_ui_bin_name
        type: str
        default: "semaphore"
        description:
          - "Executable name of the installed Semaphore UI binary. Also used as its tmux session name."
      semaphore_ui_port: &semaphore_ui_port
        type: int
        description:
          - "TCP port the Semaphore UI web server listens on."
          - "Not the Semaphore UI default of 3000, since Grafana already binds that port on the local family's control node."
          - "Example: C(3010)."
      semaphore_ui_use_tls: &semaphore_ui_use_tls
        type: bool
        default: false
        description:
          - "Enables Semaphore UI's native TLS termination (no reverse proxy) using the certificate generated by C(crypto/setup)."
      semaphore_ui_tls_private_key_file: &semaphore_ui_tls_private_key_file
        type: str
        default: "server.key"
        description:
          - "Sets the Semaphore UI TLS private key filename."
      semaphore_ui_tls_cert_file: &semaphore_ui_tls_cert_file
        type: str
        default: "server.crt"
        description:
          - "Sets the Semaphore UI TLS certificate filename."
      semaphore_ui_username: &semaphore_ui_username
        type: str
        required: true
        description:
          - "Login of the Semaphore UI admin user created on C(config/transfer)."
          - "Example: C(admin)."
      semaphore_ui_password: &semaphore_ui_password
        type: str
        required: true
        description:
          - "Password of the Semaphore UI admin user created on C(config/transfer)."
          - "Example: C(my_semaphore_password)."
          - "Store this value in Ansible Vault."
      semaphore_ui_email: &semaphore_ui_email
        type: str
        required: true
        description:
          - "Email address of the Semaphore UI admin user created on C(config/transfer)."
          - "Example: C(admin@example.com)."
      semaphore_ui_remote_config_dir: &semaphore_ui_remote_config_dir
        type: path
        default: "{{ remote_config_dir }}"
        description:
          - "Directory on the managed host holding the rendered Semaphore UI server configuration and project seed files."
      semaphore_ui_remote_data_dir: &semaphore_ui_remote_data_dir
        type: path
        default: "{{ remote_data_dir }}"
        description:
          - "Directory on the managed host holding the Semaphore UI SQLite database, scratch space, and generated secrets."
      semaphore_ui_config_file: &semaphore_ui_config_file
        type: str
        default: "config.json"
        description:
          - "File name of the rendered Semaphore UI server configuration."
      semaphore_ui_database_file: &semaphore_ui_database_file
        type: str
        default: "database.db"
        description:
          - "File name of the Semaphore UI SQLite database."
      semaphore_ui_project_seed_file: &semaphore_ui_project_seed_file
        type: str
        default: "project.json"
        description:
          - "File name of the rendered Semaphore UI project seed, consumed by C(semaphore project import)."
      semaphore_ui_ansible_config_path: &semaphore_ui_ansible_config_path
        type: path
        default: "{{ project_dir }}/examples/ansible.cfg"
        description:
          - "Absolute path on the managed host of the C(ansible.cfg) exported as C(ANSIBLE_CONFIG) to every Semaphore UI task, so a task launched from the UI picks up the same Ansible settings (C(host_key_checking), C(gathering), C(deprecation_warnings), and so on) as running C(make <target>) from a shell."
          - "Defaults to the repository's own C(examples/ansible.cfg), the very file the Makefile itself exports as C(ANSIBLE_CONFIG). Point this at any other file, inside or outside C(project_dir), to run Semaphore UI tasks under a different Ansible configuration."
          - "Example: C(/etc/ansible/ansible.cfg)."
      semaphore_ui_project_name: &semaphore_ui_project_name
        type: str
        default: "Fabric-X"
        description:
          - "Name of the Semaphore UI project seeded on C(config/transfer)."
      semaphore_ui_repository_name: &semaphore_ui_repository_name
        type: str
        default: "Fabric-X collection"
        description:
          - "Name of the Semaphore UI repository seeded on C(config/transfer)."
      semaphore_ui_environment_name: &semaphore_ui_environment_name
        type: str
        default: "Default"
        description:
          - "Name of the empty Semaphore UI environment seeded on C(config/transfer) and attached to every seeded task template."
      semaphore_ui_skip_galaxy_install: &semaphore_ui_skip_galaxy_install
        type: bool
        default: true
        description:
          - "Sets C(skip_galaxy_install) on every seeded task template."
          - "Must stay C(true): Semaphore UI otherwise runs C(ansible-galaxy) against this repository's own C(requirements.yml) and C(collections/requirements.yml) before each task, which would reinstall this very collection from Git over the checkout it is running from."
      semaphore_ui_inventories: &semaphore_ui_inventories
        type: list
        elements: dict
        default:
          - name: "Fabric-X - local"
            path: "examples/inventory/local/fabric-x.yaml"
          - name: "Fabric-X - local (cryptogen)"
            path: "examples/inventory/local/fabric-x-cryptogen.yaml"
          - name: "Fabric-X - local (yugabyte)"
            path: "examples/inventory/local/fabric-x-yugabyte.yaml"
          - name: "Fabric-X - local (bin)"
            path: "examples/inventory/local/fabric-x-bin.yaml"
          - name: "Fabric-X - local (no mtls)"
            path: "examples/inventory/local/fabric-x-no-mtls.yaml"
          - name: "Fabric-X - local (no tls)"
            path: "examples/inventory/local/fabric-x-no-tls.yaml"
          - name: "Fabric-X - k8s"
            path: "examples/inventory/k8s/fabric-x.yaml"
          - name: "Fabric-X - k8s (yugabyte)"
            path: "examples/inventory/k8s/fabric-x-yugabyte.yaml"
          - name: "Fabric-X - k8s (cryptogen)"
            path: "examples/inventory/k8s/fabric-x-cryptogen.yaml"
          - name: "Fabric-X - k8s (no mtls)"
            path: "examples/inventory/k8s/fabric-x-no-mtls.yaml"
          - name: "Fabric-X - k8s (no tls)"
            path: "examples/inventory/k8s/fabric-x-no-tls.yaml"
          - name: "Fabric-X - openshift"
            path: "examples/inventory/openshift/fabric-x.yaml"
          - name: "Fabric-X - openshift (cryptogen)"
            path: "examples/inventory/openshift/fabric-x-cryptogen.yaml"
          - name: "Fabric-X - distributed"
            path: "examples/inventory/distributed/fabric-x.yaml"
        description:
          - "Inventories seeded as Semaphore UI C(file) inventories, one per Fabric-X network sample under C(examples/inventory). Each item needs C(name) and C(path) (relative to C(project_dir))."
          - "Not discovered automatically; kept in sync by hand with C(examples/inventory). Add, rename, or remove an entry here when a sample inventory is added, renamed, or removed there."
      semaphore_ui_job_templates: &semaphore_ui_job_templates
        type: list
        elements: dict
        default:
          - name: "010 - Fabric-X - Binaries"
            playbook: "examples/playbooks/10-binaries.yaml"
            inventory: "Fabric-X - local"
          - name: "020 - Fabric-X - Generate Crypto"
            playbook: "examples/playbooks/20-generate-crypto.yaml"
            inventory: "Fabric-X - local"
          - name: "021 - Fabric-X - Build Genesis Block"
            playbook: "examples/playbooks/21-build-genesis-block.yaml"
            inventory: "Fabric-X - local"
          - name: "030 - Fabric-X - Configs"
            playbook: "examples/playbooks/30-configs.yaml"
            inventory: "Fabric-X - local"
          - name: "040 - Fabric-X - Start"
            playbook: "examples/playbooks/40-start.yaml"
            inventory: "Fabric-X - local"
          - name: "041 - Fabric-X - Init"
            playbook: "examples/playbooks/41-init.yaml"
            inventory: "Fabric-X - local"
          - name: "050 - Fabric-X - Stop"
            playbook: "examples/playbooks/50-stop.yaml"
            inventory: "Fabric-X - local"
          - name: "060 - Fabric-X - Teardown"
            playbook: "examples/playbooks/60-teardown.yaml"
            inventory: "Fabric-X - local"
            limit:
              - "all:!semaphore_ui"
          - name: "070 - Fabric-X - Ping"
            playbook: "examples/playbooks/70-ping.yaml"
            inventory: "Fabric-X - local"
          - name: "093 - Fabric-X - Get Metrics"
            playbook: "examples/playbooks/93-get-metrics.yaml"
            inventory: "Fabric-X - local"
          - name: "095 - Fabric-X - Fetch Crypto"
            playbook: "examples/playbooks/95-fetch-crypto.yaml"
            inventory: "Fabric-X - local"
          - name: "096 - Fabric-X - Fetch Logs"
            playbook: "examples/playbooks/96-fetch-logs.yaml"
            inventory: "Fabric-X - local"
          - name: "100 - Fabric-X - Wipe"
            playbook: "examples/playbooks/100-wipe.yaml"
            inventory: "Fabric-X - local"
            limit:
              - "all:!semaphore_ui"
          - name: "110 - Fabric-X - Hard Wipe"
            playbook: "examples/playbooks/110-hard-wipe.yaml"
            inventory: "Fabric-X - local"
            limit:
              - "all:!semaphore_ui"
        description:
          - "Task templates seeded for the numbered example playbooks under C(examples/playbooks/). Each item needs C(name) and C(playbook), and an optional C(inventory) name. Omitted entirely from the seed if not set — there is no fallback to any other C(semaphore_ui_inventories) entry."
          - "Not discovered automatically; kept in sync by hand with C(examples/playbooks). Add, rename, or remove an entry here when a numbered playbook is added, renamed, or removed there."
          - 'An optional C(limit) sets this template''s default Ansible C(--limit), rendered as-is. Set to C(["all:!semaphore_ui"]) on the C(teardown)/C(wipe)/C(hard-wipe) entries by default, so they never tear Semaphore UI down along with a Fabric-X network sharing its inventory. An operator can still override it per run through the Limit field.'
      semaphore_ui_extra_survey_vars: &semaphore_ui_extra_survey_vars
        type: list
        elements: dict
        description:
          - "Additional Semaphore UI survey variables appended to every seeded task template's survey variables, alongside the always-present C(target_hosts) one."
          - "Each item follows Semaphore UI's own survey variable schema."
          - "Example: C([{'name': 'log_level', 'title': 'Log level', 'type': 'enum', 'values': [{'name': 'debug', 'value': 'debug'}, {'name': 'info', 'value': 'info'}]}])."

  bin/install:
    short_description: Install the Semaphore UI binary
    description:
      - "Downloads the platform-matched Semaphore UI release archive and extracts it, unless the binary is already present."
    options:
      remote_node_dir: *remote_node_dir
      semaphore_ui_version: *semaphore_ui_version
      semaphore_ui_edition: *semaphore_ui_edition
      semaphore_ui_bin_name: *semaphore_ui_bin_name

  bin/start:
    short_description: Start the Semaphore UI binary
    description:
      - "Starts Semaphore UI in a tmux session and waits for its web port to become reachable."
    options:
      remote_config_dir: *remote_config_dir
      semaphore_ui_bin_name: *semaphore_ui_bin_name
      semaphore_ui_remote_config_dir: *semaphore_ui_remote_config_dir
      semaphore_ui_config_file: *semaphore_ui_config_file
      semaphore_ui_port: *semaphore_ui_port

  bin/stop:
    short_description: Stop the Semaphore UI binary
    description:
      - "Stops the tmux session running Semaphore UI."
    options:
      semaphore_ui_bin_name: *semaphore_ui_bin_name

  bin/rm:
    short_description: Remove the Semaphore UI binary
    description:
      - "Deletes the installed Semaphore UI binary from the managed host."
    options:
      semaphore_ui_bin_name: *semaphore_ui_bin_name

  bin/fetch_logs:
    short_description: Fetch Semaphore UI log output
    description:
      - "Copies the Semaphore UI log file from the managed host to the control node without failing when the file is absent."
    options:
      semaphore_ui_bin_name: *semaphore_ui_bin_name

  crypto/setup:
    short_description: Generate the Semaphore UI TLS certificate
    description:
      - "Dispatches TLS certificate generation for Semaphore UI's native HTTPS listener when C(semaphore_ui_use_tls) is enabled."
    options:
      semaphore_ui_use_tls: *semaphore_ui_use_tls

  crypto/openssl/generate_cert:
    short_description: Generate the Semaphore UI TLS certificate with OpenSSL
    description:
      - "Generates a self-signed TLS certificate and private key for Semaphore UI's native HTTPS listener."
    options:
      remote_config_dir: *remote_config_dir
      semaphore_ui_remote_config_dir: *semaphore_ui_remote_config_dir
      semaphore_ui_tls_private_key_file: *semaphore_ui_tls_private_key_file
      semaphore_ui_tls_cert_file: *semaphore_ui_tls_cert_file

  start:
    short_description: Start the Semaphore UI binary
    description:
      - "Migrates and seeds the database if it is missing (C(db/setup)), starts the Semaphore UI binary, then prints its effective URL and admin username."
    options:
      semaphore_ui_username: *semaphore_ui_username

  stop:
    short_description: Stop the Semaphore UI binary
    description:
      - "Stops the Semaphore UI binary."
    options: {}

  fetch_logs:
    short_description: Fetch Semaphore UI log output
    description:
      - "Copies the Semaphore UI log file from the managed host to the control node without failing when the file is absent."
    options: {}

  teardown:
    short_description: Stop Semaphore UI and remove its data
    description:
      - "Stops the Semaphore UI binary and deletes its data directory (SQLite database, scratch space, and generated secrets)."
      - "Leaves the installed binary and rendered configuration files in place. A subsequent C(start) re-migrates and re-seeds the database (C(db/setup))."
    options: {}

  wipe:
    short_description: Remove all Semaphore UI state
    description:
      - "Runs C(teardown), then also removes the installed binary and the rendered configuration files."
    options: {}

  ping:
    short_description: Check whether the Semaphore UI port is reachable
    description:
      - "Probes C(semaphore_ui_port) on the managed host without failing the play."
    options:
      semaphore_ui_port: *semaphore_ui_port

  effective_address:
    short_description: Compute the reachable Semaphore UI URL
    description:
      - "Sets C(semaphore_ui_effective_address) from C(actual_host), C(semaphore_ui_port), and C(semaphore_ui_use_tls)."
    options:
      actual_host: *actual_host
      semaphore_ui_port: *semaphore_ui_port
      semaphore_ui_use_tls: *semaphore_ui_use_tls

  config/transfer:
    short_description: Render the Semaphore UI server configuration and project seed
    description:
      - "Generates and persists the server secrets on first run, then renders C(config.json) and the project seed file from templates."
      - "Database migration and seeding is not done here: C(start) does it (C(db/setup)), skipping it when the database already exists."
    options:
      remote_config_dir: *remote_config_dir
      remote_data_dir: *remote_data_dir
      project_dir: *project_dir
      semaphore_ui_remote_config_dir: *semaphore_ui_remote_config_dir
      semaphore_ui_remote_data_dir: *semaphore_ui_remote_data_dir
      semaphore_ui_config_file: *semaphore_ui_config_file
      semaphore_ui_project_seed_file: *semaphore_ui_project_seed_file
      semaphore_ui_database_file: *semaphore_ui_database_file
      semaphore_ui_port: *semaphore_ui_port
      semaphore_ui_use_tls: *semaphore_ui_use_tls
      semaphore_ui_tls_private_key_file: *semaphore_ui_tls_private_key_file
      semaphore_ui_tls_cert_file: *semaphore_ui_tls_cert_file
      semaphore_ui_ansible_config_path: *semaphore_ui_ansible_config_path
      semaphore_ui_project_name: *semaphore_ui_project_name
      semaphore_ui_repository_name: *semaphore_ui_repository_name
      semaphore_ui_inventories: *semaphore_ui_inventories
      semaphore_ui_environment_name: *semaphore_ui_environment_name
      semaphore_ui_job_templates: *semaphore_ui_job_templates
      semaphore_ui_extra_survey_vars: *semaphore_ui_extra_survey_vars
      semaphore_ui_skip_galaxy_install: *semaphore_ui_skip_galaxy_install

  db/setup:
    short_description: Migrate and seed the Semaphore UI database if it is missing
    description:
      - "Checks whether the Semaphore UI SQLite database file exists and, only if it does not, ensures the data directory exists, runs database migrations, then ensures the admin user and the Fabric-X project exist. A repeated run against a live instance is a no-op."
      - "Run this only against a stopped server: the CLI commands used here write directly to the SQLite database, so running them while the server is live risks contending for the same file."
      - "Idempotent, but not a reconciler. The admin user is only created if it does not already exist, and the project import is a safe no-op if a project with the same name already exists — but it will not update an existing project when C(semaphore_ui_inventories)/C(semaphore_ui_job_templates) change."
    options:
      remote_node_dir: *remote_node_dir
      remote_config_dir: *remote_config_dir
      remote_data_dir: *remote_data_dir
      semaphore_ui_bin_name: *semaphore_ui_bin_name
      semaphore_ui_remote_config_dir: *semaphore_ui_remote_config_dir
      semaphore_ui_remote_data_dir: *semaphore_ui_remote_data_dir
      semaphore_ui_config_file: *semaphore_ui_config_file
      semaphore_ui_database_file: *semaphore_ui_database_file
      semaphore_ui_project_seed_file: *semaphore_ui_project_seed_file
      semaphore_ui_username: *semaphore_ui_username
      semaphore_ui_email: *semaphore_ui_email
      semaphore_ui_password: *semaphore_ui_password

  config/rm:
    short_description: Remove the Semaphore UI configuration files
    description:
      - "Deletes the directory holding the rendered Semaphore UI server configuration and project seed files."
    options:
      remote_config_dir: *remote_config_dir
      semaphore_ui_remote_config_dir: *semaphore_ui_remote_config_dir

  data/rm:
    short_description: Remove the Semaphore UI data directory
    description:
      - "Deletes the directory holding the Semaphore UI SQLite database, scratch space, and generated secrets."
    options:
      remote_data_dir: *remote_data_dir
      semaphore_ui_remote_data_dir: *semaphore_ui_remote_data_dir
