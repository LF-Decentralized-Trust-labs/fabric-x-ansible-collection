- name: Check whether the Semaphore UI database exists
  ansible.builtin.stat:
    path: "{{ semaphore_ui_remote_data_dir }}/{{ semaphore_ui_database_file }}"
  register: semaphore_ui_database

- name: Migrate and seed the Semaphore UI database when it is missing
  when:
    - not semaphore_ui_database.stat.exists
  block:
    - name: Ensure the Semaphore UI data directory exists
      ansible.builtin.file:
        path: "{{ semaphore_ui_remote_data_dir }}"
        state: directory
        mode: "0o755"
    - name: Run Semaphore UI database migrations
      ansible.builtin.command: >-
        {{ remote_node_dir }}/bin/{{ semaphore_ui_bin_name }} migrate
        --config {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_config_file }}
      register: semaphore_ui_migrate
      changed_when: "'Migrations Finished' in semaphore_ui_migrate.stdout"
    - name: Check if the Semaphore UI admin user exists
      ansible.builtin.command: >-
        {{ remote_node_dir }}/bin/{{ semaphore_ui_bin_name }} user get
        --login {{ semaphore_ui_username }}
        --config {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_config_file }}
      register: semaphore_ui_admin_user_check
      changed_when: false
      failed_when: false
      no_log: true
    - name: Create the Semaphore UI admin user
      vars:
        bin_name: "{{ semaphore_ui_bin_name }}"
        bin_run_with_tmux: false
        bin_collect_logs: false
        bin_command: >-
          {{ semaphore_ui_bin_name }} user add
          --admin --login {{ semaphore_ui_username }}
          --email {{ semaphore_ui_email }}
          --name {{ semaphore_ui_username }}
          --password {{ semaphore_ui_password | quote }}
          --config {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_config_file }}
      ansible.builtin.include_role:
        name: hyperledger.fabricx.bin
        tasks_from: start
      when:
        - semaphore_ui_admin_user_check.rc != 0
    # Safe to re-run: Semaphore UI refuses to import over an existing project rather than
    # overwriting it. It will not, however, update an existing project when
    # semaphore_ui_inventories/semaphore_ui_job_templates change.
    - name: Import the Semaphore UI Fabric-X project
      ansible.builtin.command: >-
        {{ remote_node_dir }}/bin/{{ semaphore_ui_bin_name }} project import
        --file {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_project_seed_file }}
        --config {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_config_file }}
      register: semaphore_ui_project_import
      changed_when: semaphore_ui_project_import.rc == 0
      failed_when:
        - semaphore_ui_project_import.rc != 0
        - "'already exists' not in semaphore_ui_project_import.stderr"
