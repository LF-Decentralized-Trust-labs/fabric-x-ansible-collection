- name: Start the Semaphore UI binary
  vars:
    bin_name: "{{ semaphore_ui_bin_name }}"
    bin_command: >-
      {{ semaphore_ui_bin_name }} server
      --config {{ semaphore_ui_remote_config_dir }}/{{ semaphore_ui_config_file }}
    bin_wait_until_running: true
    bin_wait_port: "{{ semaphore_ui_port }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.bin
    tasks_from: start
