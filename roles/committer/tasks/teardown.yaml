- name: Teardown Fabric-X Committer components
  when:
    - committer_component_type is defined
  block:
    - name: Teardown Fabric-X Committer components
      vars:
        committer_teardown_tasks:
          container: container/rm
          bin: bin/stop
          k8s: k8s/rm
          openshift: openshift/rm
      ansible.builtin.include_role:
        name: hyperledger.fabricx.committer
        tasks_from: "{{ committer_teardown_tasks[committer_deployment_mode] }}"
    - name: Remove Fabric-X Committer sidecar data
      ansible.builtin.include_role:
        name: hyperledger.fabricx.committer
        tasks_from: data/rm
      when:
        - committer_component_type == 'sidecar'
