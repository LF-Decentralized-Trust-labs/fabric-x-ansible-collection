- name: Delete Fabric-X Committer workload
  vars:
    committer_k8s_workload_kinds:
      validator: Deployment
      verifier: Deployment
      coordinator: Deployment
      sidecar: StatefulSet
      query-service: Deployment
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: "{{ committer_k8s_workload_kinds[committer_component_type] }}"
    name: "{{ committer_k8s_resource_name }}"
    namespace: "{{ k8s_namespace | default('default') }}"

- name: Delete Fabric-X Committer Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ committer_k8s_resource_name }}"
    namespace: "{{ k8s_namespace | default('default') }}"

- name: Delete Fabric-X Committer NodePort Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ committer_k8s_resource_name }}-nodeport"
    namespace: "{{ k8s_namespace | default('default') }}"
  when:
    - committer_k8s_rpc_node_port is defined or
      committer_k8s_metrics_node_port is defined

- name: Delete Fabric-X Committer LoadBalancer Service
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: "{{ committer_k8s_resource_name }}-loadbalancer"
    namespace: "{{ k8s_namespace | default('default') }}"
  when:
    - committer_k8s_loadbalancer_expose_rpc_port or
      committer_k8s_loadbalancer_expose_metrics_port

- name: Delete Fabric-X Committer database-init Job
  vars:
    reference_committer_hosts: >-
      {{
        (
          groups['fabric_x_committers']
          | map('extract', hostvars)
          | selectattr('organization', 'defined')
          | selectattr('organization.domain', 'defined')
          | selectattr('organization.domain', '==', organization.domain)
          | map(attribute='inventory_hostname')
          | list
        )
        or groups['fabric_x_committers']
      }}
    committer_validators: >-
      {{
        reference_committer_hosts
        | map('extract', hostvars)
        | selectattr('committer_component_type', 'defined')
        | selectattr('committer_component_type', '==', 'validator')
        | map(attribute='inventory_hostname')
        | sort
        | list
      }}
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    name: "{{ committer_k8s_resource_name }}-init-db"
    namespace: "{{ k8s_namespace | default('default') }}"
  when:
    - committer_component_type == 'validator'
    - inventory_hostname == committer_validators[0]
