- name: Stop Fabric-X Committer components
  ansible.builtin.include_role:
    name: hyperledger.fabricx.committer
    tasks_from: "{{ committer_deployment_mode }}/stop"
  when:
    - committer_deployment_mode in ['bin', 'container']
    - committer_component_type is defined
