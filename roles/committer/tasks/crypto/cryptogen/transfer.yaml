- name: Ensure Hyperledger Fabric-X Committer config directory exists
  ansible.builtin.file:
    path: "{{ committer_remote_config_dir }}"
    state: directory
    mode: "0o755"

# =========================
# MSP certs
# =========================
- name: Transfer the MSP crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ committer_crypto_name }}.{{ organization.domain }}/msp"
    dest: "{{ committer_remote_config_dir }}"
  when:
    - committer_component_type == 'sidecar'

# =========================
# TLS certs
# =========================
- name: Transfer the TLS crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ committer_crypto_name }}.{{ organization.domain }}/tls"
    dest: "{{ committer_remote_config_dir }}"
  when:
    - committer_use_tls

# =========================
# User MSP
# =========================
# The organization user declared on this host (e.g. the admin identity used by fxadmin)
# is shipped next to the node identity, so any tool running here can sign with it.
- name: Ensure the committer users config directory exists
  ansible.builtin.file:
    path: "{{ committer_remote_config_dir }}/users"
    state: directory
    mode: "0o755"
  when:
    - organization.user is defined

- name: Transfer the user crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/users/{{ organization.user.name }}@{{ organization.domain }}"
    dest: "{{ committer_remote_config_dir }}/users"
  when:
    - organization.user is defined
