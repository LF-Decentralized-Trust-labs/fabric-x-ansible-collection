# =========================
# Peer MSP
# =========================
- name: Ensure Hyperledger Fabric-X Loadgen config directory exists
  ansible.builtin.file:
    path: "{{ loadgen_remote_config_dir }}"
    state: directory
    mode: "0o755"

- name: Transfer the MSP peer crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ loadgen_crypto_name }}.{{ organization.domain }}/msp"
    dest: "{{ loadgen_remote_config_dir }}"

# =========================
# User MSP
# =========================
- name: Ensure the load-generator users config directory exists
  ansible.builtin.file:
    path: "{{ loadgen_remote_config_dir }}/users"
    state: directory
    mode: "0o755"
  when:
    - organization.user is defined

- name: Transfer the Fabric-X Loadgen user crypto material
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/users/{{ organization.user.name }}@{{ organization.domain }}"
    dest: "{{ loadgen_remote_config_dir }}/users"
  when:
    - organization.user is defined

# =========================
# TLS
# =========================
- name: Transfer the TLS crypto material generated with cryptogen
  ansible.posix.synchronize:
    src: "{{ cryptogen_artifacts_dir }}/crypto/organizations/{{ organization.domain }}/peers/{{ loadgen_crypto_name }}.{{ organization.domain }}/tls"
    dest: "{{ loadgen_remote_config_dir }}"
  when:
    - loadgen_use_tls or loadgen_monitoring_use_tls
