- name: Define fxadmin output directory
  ansible.builtin.set_fact:
    fxadmin_output_dir: "{{ fxadmin_output | dirname }}"

- name: Ensure fxadmin output directory exists
  ansible.builtin.file:
    path: "{{ fxadmin_output_dir }}"
    state: directory
    mode: "0o755"

- name: Transfer the merged, endorsed ConfigUpdate to prepare
  ansible.builtin.copy:
    src: "{{ fxadmin_endorsed_config_update }}"
    dest: "{{ fxadmin_output_dir }}/endorsed_config_update.pb"
    mode: preserve

- name: Prepare the Fabric-X transaction with the fxadmin binary
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: bin/tx/prepare
  when:
    - fxadmin_use_bin

- name: Prepare the Fabric-X transaction with the fxadmin container
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: container/tx/prepare
  when:
    - not fxadmin_use_bin

- name: Fetch the prepared transaction back to the control node
  ansible.builtin.fetch:
    src: "{{ fxadmin_output }}"
    dest: "{{ fxadmin_output_fetch_dest }}"
    flat: true
    mode: preserve
