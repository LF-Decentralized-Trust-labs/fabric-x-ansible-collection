- name: Ensure fxadmin output directory exists
  ansible.builtin.file:
    path: "{{ fxadmin_output | dirname }}"
    state: directory
    mode: "0o755"

- name: Find all endorsements to merge
  ansible.builtin.find:
    paths: "{{ fxadmin_endorsements_dir }}"
    patterns: "*.pb"
    recurse: true
    file_type: file
  register: fxadmin_endorsements_find_result

- name: Set found endorsements
  ansible.builtin.set_fact:
    fxadmin_endorsements: >-
      {{
        fxadmin_endorsements_find_result.files
        | map(attribute='path')
        | list
      }}

- name: Assert at least one endorsement was collected
  ansible.builtin.assert:
    that:
      - fxadmin_endorsements | length > 0
    fail_msg: >-
      No endorsements found under {{ fxadmin_endorsements_dir }}: every
      tx/endorse call must have failed or been skipped upstream. Refusing to
      write an empty merged ConfigUpdateEnvelope.

- name: Set single endorsement as merged one
  ansible.builtin.copy:
    src: "{{ fxadmin_endorsements[0] }}"
    dest: "{{ fxadmin_output }}"
    mode: preserve
  when:
    - fxadmin_endorsements | length == 1

- name: Merge multiple endorsements into a single ConfigUpdateEnvelope
  vars:
    bin_command: >-
      {{ fxadmin_bin_name }} tx
      merge
      {% if fxadmin_endorsements is defined %}
      {% for fxadmin_endorsement in fxadmin_endorsements %}
      {{ fxadmin_endorsement }}
      {% endfor %}
      {% endif %}
      --output={{ fxadmin_output }}
    bin_remote_dir: "{{ cli_bin_dir }}"
    bin_run_with_tmux: false
    bin_collect_logs: false
  ansible.builtin.include_role:
    name: hyperledger.fabricx.bin
    tasks_from: start
  when:
    - fxadmin_endorsements | length > 1
