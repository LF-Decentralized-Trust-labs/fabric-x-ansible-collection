- name: Ensure fxadmin output directory exists
  ansible.builtin.file:
    path: "{{ fxadmin_output | dirname }}"
    state: directory
    mode: "0o755"

- name: Transfer the reference configuration block
  ansible.builtin.copy:
    src: "{{ fxadmin_current_block }}"
    dest: "{{ fxadmin_output | dirname }}/current_block.pb"
    mode: preserve

- name: Follow the ledger until the submitted configuration commits
  vars:
    bin_command: >-
      {{ fxadmin_bin_name }} follow
      --config={{ fxadmin_remote_config_dir }}/{{ fxadmin_config_file }}
      --current-block={{ fxadmin_output | dirname }}/current_block.pb
      --timeout={{ fxadmin_follow_timeout }}
      --output={{ fxadmin_output }}
    bin_run_with_tmux: false
    bin_collect_logs: false
  ansible.builtin.include_role:
    name: hyperledger.fabricx.bin
    tasks_from: start

- name: Fetch the committed configuration block back to the control node
  ansible.builtin.fetch:
    src: "{{ fxadmin_output }}"
    dest: "{{ fxadmin_output_fetch_dest }}"
    flat: true
    mode: preserve
