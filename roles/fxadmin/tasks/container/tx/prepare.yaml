- name: Define fxadmin output directory
  ansible.builtin.set_fact:
    fxadmin_output_dir: "{{ fxadmin_output | dirname }}"

- name: Ensure fxadmin output directory exists
  ansible.builtin.file:
    path: "{{ fxadmin_output_dir }}"
    state: directory
    mode: "0o755"

- name: Transfer the endorsed ConfigUpdate to prepare
  ansible.builtin.copy:
    src: "{{ fxadmin_endorsed_config_update }}"
    dest: "{{ fxadmin_output_dir }}/endorsed_config_update.pb"
    mode: preserve

- name: Prepare the Fabric-X transaction from the endorsed ConfigUpdate
  vars:
    container_name: "{{ fxadmin_container_name }}-tx-prepare"
    container_image: "{{ fxadmin_image }}"
    container_command: >-
      {{ fxadmin_bin_name }} tx
      prepare
      /tmp/endorsed_config_update.pb
      --config={{ fxadmin_container_config_dir }}/{{ fxadmin_config_file }}
      --output=/tmp/{{ fxadmin_output | basename }}
    container_volumes:
      - "{{ fxadmin_remote_config_dir }}:{{ fxadmin_container_config_dir }}:z,ro"
      - "{{ fxadmin_output_dir }}:/tmp:z"
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start

- name: Fetch the prepared transaction back to the control node
  ansible.builtin.fetch:
    src: "{{ fxadmin_output }}"
    dest: "{{ fxadmin_output_fetch_dest }}"
    flat: true
    mode: preserve
