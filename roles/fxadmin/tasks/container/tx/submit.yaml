- name: Define fxadmin working directory
  ansible.builtin.set_fact:
    fxadmin_output_dir: "{{ fxadmin_config_tx | dirname }}"

- name: Transfer the transaction and the reference configuration block
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ fxadmin_output_dir }}/{{ item.dest }}"
    mode: preserve
  loop:
    - src: "{{ fxadmin_config_tx }}"
      dest: config_tx.pb
    - src: "{{ fxadmin_current_block }}"
      dest: current_block.pb
  loop_control:
    label: "{{ item.dest }}"

- name: Submit the Fabric-X transaction
  vars:
    container_name: "{{ fxadmin_container_name }}-tx-submit"
    container_image: "{{ fxadmin_image }}"
    container_command: >-
      {{ fxadmin_bin_name }} tx
      submit
      /tmp/config_tx.pb
      --config={{ fxadmin_container_config_dir }}/{{ fxadmin_config_file }}
      --current-block=/tmp/current_block.pb
    container_volumes:
      - "{{ fxadmin_remote_config_dir }}:{{ fxadmin_container_config_dir }}:z,ro"
      - "{{ fxadmin_output_dir }}:/tmp:z"
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
