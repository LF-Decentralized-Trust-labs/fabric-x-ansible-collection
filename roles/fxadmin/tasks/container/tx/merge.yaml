- name: Merge multiple endorsements into a single ConfigUpdateEnvelope
  vars:
    container_name: "{{ fxadmin_container_name }}-tx-merge"
    container_image: "{{ fxadmin_image }}"
    container_command: >-
      {{ fxadmin_bin_name }} tx
      merge
      {% for fxadmin_endorsement in fxadmin_endorsements %}
      /endorsements/{{ fxadmin_endorsement | basename }}
      {% endfor %}
      --output=/tmp/{{ fxadmin_output | basename }}
    container_volumes:
      - "{{ fxadmin_endorsements_dir }}:/endorsements:z,ro"
      - "{{ fxadmin_output_dir }}:/tmp:z"
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
