# The container can only read from the directory it mounts, so the inputs are
# staged into fxadmin_output_dir first. The binary variant reads them in place.
- name: Transfer the current and modified configuration JSON files and the reference block
  ansible.builtin.copy:
    src: "{{ current_input_file.src }}"
    dest: "{{ fxadmin_output_dir }}/{{ current_input_file.dest }}"
    mode: preserve
  loop:
    - src: "{{ fxadmin_current_config_json }}"
      dest: current_config.json
    - src: "{{ fxadmin_modified_config_json }}"
      dest: modified_config.json
    - src: "{{ fxadmin_current_block }}"
      dest: current_block.pb
  loop_control:
    loop_var: current_input_file
    label: "{{ current_input_file.dest }}"

- name: Compute the Fabric-X ConfigUpdate between the current and modified configuration
  vars:
    container_name: "{{ fxadmin_container_name }}-compute-update"
    container_image: "{{ fxadmin_image }}"
    container_command: >-
      {{ fxadmin_bin_name }} compute-update
      /tmp/current_config.json
      /tmp/modified_config.json
      --current-block=/tmp/current_block.pb
      --output=/tmp/{{ fxadmin_output | basename }}
    container_volumes:
      - "{{ fxadmin_output_dir }}:/tmp:z"
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
