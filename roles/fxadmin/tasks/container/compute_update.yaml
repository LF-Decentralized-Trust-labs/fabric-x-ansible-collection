# The inputs are mounted read-only from where they already are, so nothing is
# copied. The binary variant reads them in place.
- name: Compute the Fabric-X ConfigUpdate between the current and modified configuration
  vars:
    container_name: "{{ fxadmin_container_name }}-compute-update"
    container_image: "{{ fxadmin_image }}"
    container_command: >-
      {{ fxadmin_bin_name }} compute-update
      /inputs/current_config.json
      /inputs/modified_config.json
      --current-block=/inputs/current_block.pb
      --output=/tmp/{{ fxadmin_output | basename }}
    container_volumes:
      - "{{ fxadmin_output_dir }}:/tmp:z"
      - "{{ fxadmin_current_config_json }}:/inputs/current_config.json:z,ro"
      - "{{ fxadmin_modified_config_json }}:/inputs/modified_config.json:z,ro"
      - "{{ fxadmin_current_block }}:/inputs/current_block.pb:z,ro"
    container_run_detach_mode: false
    container_run_as_host_user: true
    container_autoremove: true
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
