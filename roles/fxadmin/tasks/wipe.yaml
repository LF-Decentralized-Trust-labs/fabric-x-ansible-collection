- name: Remove the fxadmin binary
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: bin/rm
  when:
    - fxadmin_use_bin

- name: Remove the rendered fxadmin configuration and identity material
  ansible.builtin.file:
    path: "{{ fxadmin_remote_config_dir }}"
    state: absent
