# roles/cryptogen/tasks/fetch.yaml only ever fetches the organization's root
# MSP, never a user identity, so organization.user is fetched directly here.
- name: Ensure the fxadmin {{ fxadmin_identity_name }} identity directory exists
  ansible.builtin.file:
    path: "{{ fetched_artifacts_dir }}/crypto/ordererOrganizations/{{ organization.domain }}/users/{{ fxadmin_identity_name }}@{{ organization.domain }}"
    state: directory
    mode: "0o755"

- name: Fetch the cryptogen-generated {{ fxadmin_identity_name }} identity
  vars:
    # Reconstructed from config_build_dir rather than cryptogen's own
    # cryptogen_output_dir default, which is unset outside that role's tasks.
    fxadmin_cryptogen_output_dir: "{{ cryptogen_output_dir | default(config_build_dir ~ '/cryptogen-artifacts/crypto') }}"
  ansible.posix.synchronize:
    src: "{{ fxadmin_cryptogen_output_dir }}/organizations/{{ organization.domain }}/users/{{ fxadmin_identity_name }}@{{ organization.domain }}/{{ fxadmin_identity_material }}"
    dest: "{{ fetched_artifacts_dir }}/crypto/ordererOrganizations/{{ organization.domain }}/users/{{ fxadmin_identity_name }}@{{ organization.domain }}"
  loop:
    - msp
    - tls
  loop_control:
    loop_var: fxadmin_identity_material
