# Provisions and fetches every identity declared in organization.users onto
# the control node -- by convention, an "admin"-type identity (NodeOU role
# admin, the only one able to satisfy the channel's per-org Admins policy)
# used strictly for tx/endorse, and a least-privileged "client"-type identity
# used for everything else -- ledger reads, follow, tx/prepare, tx/submit --
# none of which require admin rights. Nothing else in this collection needs
# either identity today (fxconfig's endorsers are peer/committer-org
# concepts), so this is fxadmin's own dedicated provisioning step, dispatched
# by whichever mechanism issued the organization's crypto material.
#
# organization.users defaults to an empty list: orderer organizations never
# needed it before fxadmin, so an inventory that hasn't declared any (or a
# playbook run against a non-orderer organization) must be a safe no-op here,
# not a hard failure.

# Snapshots organization immediately: this file is commonly called from a
# per-organization loop, with organization itself passed as a lazy
# "{{ item }}"-style template. Left as a live template rather than a
# concrete value, it would be vulnerable to being silently re-resolved
# against whatever the *caller's* loop variable currently holds if a future
# change ever reintroduces a default "item" loop_var somewhere in this call
# chain -- every loop below already uses a distinct loop_var, but snapshotting
# here removes the dependency on that staying true everywhere upstream too.
- name: Snapshot the organization for this provisioning run
  ansible.builtin.set_fact:
    organization: "{{ organization }}"

- name: Fetch every declared identity generated by cryptogen
  vars:
    fxadmin_identity_name: "{{ fxadmin_org_user.name }}"
    fxadmin_identity_type: "{{ fxadmin_org_user.type | default('client') }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/cryptogen/transfer
  when:
    - organization.fabric_ca_host is not defined
  loop: "{{ organization.users | default([]) }}"
  loop_control:
    loop_var: fxadmin_org_user
    label: "{{ fxadmin_org_user.name }}"

- name: Register and enroll every declared identity with Fabric CA
  vars:
    fxadmin_identity_name: "{{ fxadmin_org_user.name }}"
    fxadmin_identity_secret: "{{ fxadmin_org_user.secret }}"
    fxadmin_identity_type: "{{ fxadmin_org_user.type | default('client') }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/fabric_ca/enroll
  when:
    - organization.fabric_ca_host is defined
  loop: "{{ organization.users | default([]) }}"
  loop_control:
    loop_var: fxadmin_org_user
    label: "{{ fxadmin_org_user.name }}"
