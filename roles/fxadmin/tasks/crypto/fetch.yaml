# Provisions and fetches the identity declared in organization.user onto the
# control node. It must carry OU=admin (the only role able to satisfy the
# channel's per-org Admins policy) since it is used for every fxadmin
# operation, tx/endorse included -- there is no separate least-privileged
# identity for the read-only operations (ledger reads, follow, tx/prepare,
# tx/submit). Nothing else in this collection needs this identity today
# (fxconfig's endorsers are peer/committer-org concepts), so this is
# fxadmin's own dedicated provisioning step, dispatched by whichever
# mechanism issued the organization's crypto material.
#
# organization.user is optional: orderer organizations never needed it
# before fxadmin, so an inventory that hasn't declared one (or a playbook
# run against a non-orderer organization) must be a safe no-op here, not a
# hard failure.

- name: Fetch the declared identity generated by cryptogen
  vars:
    fxadmin_identity_name: "{{ organization.user.name }}"
    fxadmin_identity_type: "{{ organization.user.type | default('client') }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/cryptogen/transfer
  when:
    - organization.user is defined
    - organization.fabric_ca_host is not defined

- name: Register and enroll the declared identity with Fabric CA
  vars:
    fxadmin_identity_name: "{{ organization.user.name }}"
    fxadmin_identity_secret: "{{ organization.user.secret }}"
    fxadmin_identity_type: "{{ organization.user.type | default('client') }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/fabric_ca/enroll
  when:
    - organization.user is defined
    - organization.fabric_ca_host is defined
