# Provisions and fetches the identity declared in organization.user, used
# for every fxadmin operation, dispatched to whichever mechanism issued the
# organization's crypto material. organization.user is optional, so an
# organization without one is a safe no-op here.

- name: Fail when the organization's user is not an admin identity
  ansible.builtin.fail:
    msg: >-
      {{ organization.name }}'s organization.user must declare type: admin
      (found: {{ organization.user.type | default('no type') }}). fxadmin uses
      it for every operation, tx/endorse included, and only an OU=admin
      identity satisfies the channel's per-org Admins policy.
  when:
    - organization.user is defined
    - organization.user.type | default('client') != 'admin'

- name: Fetch the declared identity generated by cryptogen
  vars:
    fxadmin_identity_name: "{{ organization.user.name }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/cryptogen/transfer
  when:
    - organization.user is defined
    - organization.fabric_ca_host is not defined

- name: Register and enroll the declared identity with Fabric CA
  vars:
    fxadmin_identity_name: "{{ organization.user.name }}"
    fxadmin_identity_secret: "{{ organization.user.secret }}"
    fxadmin_identity_type: "{{ organization.user.type }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: crypto/fabric_ca/enroll
  when:
    - organization.user is defined
    - organization.fabric_ca_host is defined
