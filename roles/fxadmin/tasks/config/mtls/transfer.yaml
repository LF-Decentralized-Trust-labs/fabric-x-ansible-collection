# =========================
# mTLS material
# =========================
- name: Create folder for mTLS material
  ansible.builtin.file:
    path: "{{ fxadmin_remote_config_dir }}/mtls"
    state: directory
    mode: "0o755"

- name: Copy TLS cert to use for mTLS connection
  ansible.builtin.copy:
    src: "{{ fxadmin_mtls_client_cert_path }}"
    dest: "{{ fxadmin_remote_config_dir }}/mtls/client.crt"
    remote_src: true
    mode: preserve

- name: Copy TLS key to use for mTLS connection
  ansible.builtin.copy:
    src: "{{ fxadmin_mtls_client_key_path }}"
    dest: "{{ fxadmin_remote_config_dir }}/mtls/client.key"
    remote_src: true
    mode: preserve
