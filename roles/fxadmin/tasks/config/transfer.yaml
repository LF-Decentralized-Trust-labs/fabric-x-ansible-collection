# =========================
# Configuration
# =========================
- name: Ensure the config directory for fxadmin exists
  ansible.builtin.file:
    path: "{{ fxadmin_remote_config_dir }}"
    state: directory
    mode: "0o755"

- name: Setup the fxadmin configuration file
  vars:
    fxadmin_config_dir: >-
      {{
        fxadmin_remote_config_dir
        if fxadmin_use_bin
        else fxadmin_container_config_dir
      }}
  ansible.builtin.template:
    src: "admin.yaml.j2"
    dest: "{{ fxadmin_remote_config_dir }}/{{ fxadmin_config_file }}"
    mode: "0o644"

# =========================
# MSP and TLS material
# =========================
# Synced from the control node, where crypto provisioning of the organization
# user left it, onto the host this task runs on. The TLS identity is only read
# for the mTLS client certificate, which mtls/transfer copies out of it, so it
# is synced only when mTLS is enabled.
- name: Transfer the identity material from the control node
  ansible.posix.synchronize:
    src: "{{ fxadmin_msp_config_path | dirname }}/{{ current_identity_material }}"
    dest: "{{ fxadmin_remote_config_dir }}"
  loop: "{{ ['msp', 'tls'] if fxadmin_use_mtls | default(false) else ['msp'] }}"
  loop_control:
    loop_var: current_identity_material

# =========================
# mTLS material
# =========================
- name: Setup mTLS material for fxadmin
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: config/mtls/transfer
  when:
    - fxadmin_use_mtls | default(false)
