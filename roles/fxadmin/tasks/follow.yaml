- name: Follow the Fabric-X ledger with the fxadmin binary
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: bin/follow
  when:
    - fxadmin_use_bin

- name: Follow the Fabric-X ledger with the fxadmin container
  ansible.builtin.include_role:
    name: hyperledger.fabricx.fxadmin
    tasks_from: container/follow
  when:
    - not fxadmin_use_bin
