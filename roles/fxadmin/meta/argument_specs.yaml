      remote_config_dir: *remote_config_dir

  crypto/cryptogen/transfer:
    short_description: Fetch a cryptogen-generated identity
    description:
      - "Fetches the C(<fxadmin_identity_name>@<domain>) identity (MSP and TLS material) cryptogen generates under that name for an orderer organization's declared C(organization.user), which C(hyperledger.fabricx.cryptogen)'s own fetch task never copies to the control node."
    options:
      config_build_dir: *config_build_dir
      cryptogen_output_dir: *cryptogen_output_dir
      fetched_artifacts_dir: *fetched_artifacts_dir
      fxadmin_identity_name: *fxadmin_identity_name
      organization: *organization

  crypto/fabric_ca/enroll:
    short_description: Register and enroll an identity with Fabric CA
    description:
      - "Registers and enrolls an org-level identity (MSP and a dedicated TLS identity) for an orderer organization on its Fabric CA host, then fetches the enrolled material to the control node."
      - "Nothing else provisions this identity today; orderer nodes only enroll their own node identity."
    options:
      fetched_artifacts_dir: *fetched_artifacts_dir
      fxadmin_identity_name: *fxadmin_identity_name
      fxadmin_identity_secret: *fxadmin_identity_secret
      fxadmin_identity_type: *fxadmin_identity_type
      organization: *organization

  crypto/fetch:
    short_description: Provision the identity declared in an orderer organization's user
    description:
      - "Dispatches identity provisioning for C(organization.user) to either the cryptogen or Fabric CA path based on whether C(organization.fabric_ca_host) is defined."
    options:
      organization: *organization

  decode:
    short_description: Decode a configuration block
    description:
      - "Dispatches configuration block decoding to either the host binary or a transient container based on C(fxadmin_use_bin)."
