      fxadmin_use_bin: *fxadmin_use_bin

  patch_config_value:
    short_description: Patch a decoded channel configuration
    description:
      - "Reads the decoded current channel configuration JSON, deep-merges a caller-supplied partial structure into it, and writes the resulting modified configuration JSON."
      - "Contains no business logic of its own -- the caller supplies the exact nested path and value to change, keeping this role a generic fxadmin wrapper reusable by any future reconfiguration flow."
    options:
      fxadmin_current_config_json: *fxadmin_current_config_json
      fxadmin_json_patch: *fxadmin_json_patch
      fxadmin_modified_config_json: *fxadmin_modified_config_json

