# =========================
# Output directories
# =========================
- name: Ensure that the config directory exists
  ansible.builtin.file:
    path: "{{ openssl_remote_config_dir }}"
    state: directory
    mode: "{{ openssl_dir_mode }}"

- name: Ensure that the key output directory exists
  ansible.builtin.file:
    path: "{{ openssl_private_key_path | dirname }}"
    state: directory
    mode: "{{ openssl_dir_mode }}"

- name: Ensure that the CSR output directory exists
  ansible.builtin.file:
    path: "{{ openssl_csr_path | dirname }}"
    state: directory
    mode: "{{ openssl_dir_mode }}"

# =========================
# Drift detection
# =========================
# The extension file mirrors the same v3_req section rendered into the main config below, so
# fingerprinting the main config content alone is enough to detect a SAN/extension change.
- name: Inspect the existing CSR
  vars:
    openssl_artifact_path: "{{ openssl_csr_path }}"
    openssl_fingerprint_inputs:
      - "{{ lookup('template', 'conf.yaml.j2') }}"
      - "{{ openssl_key_type }}"
      - "{{ openssl_key_opt | default('') }}"
      - "{{ openssl_cert_duration }}"
  ansible.builtin.include_role:
    name: hyperledger.fabricx.openssl
    tasks_from: inspect

# =========================
# Generation
# =========================
- name: Generate the CSR and record its fingerprint
  when:
    - openssl_must_run
  block:
    - name: Create the OpenSSL CSR configuration file
      ansible.builtin.template:
        src: "conf.yaml.j2"
        dest: "{{ openssl_remote_config_dir }}/{{ openssl_config_file }}"
        mode: "0o644"
    - name: Create the OpenSSL CSR extension file
      ansible.builtin.template:
        src: "ext.yaml.j2"
        dest: "{{ openssl_ext_file_path }}"
        mode: "0o644"
      when:
        - openssl_ext_file_path is defined
    - name: Generate private key and self-signed certificate
      ansible.builtin.command: >-
        openssl req
        -new
        -newkey {{ openssl_key_type }}
        -keyout {{ openssl_private_key_path }}
        -out {{ openssl_csr_path }}
        -days {{ openssl_cert_duration }}
        -config {{ openssl_remote_config_dir }}/{{ openssl_config_file }}
        -nodes
        -reqexts v3_req
        {% if openssl_key_opt is defined %}
        -pkeyopt {{ openssl_key_opt }}
        {% endif %}
      changed_when: true
    # =========================
    # State
    # =========================
    - name: Write the OpenSSL state file
      vars:
        openssl_state_fingerprints: >-
          {{
            openssl_recorded_fingerprints | default({})
            | combine({
              openssl_csr_path: openssl_current_fingerprint
            })
          }}
      ansible.builtin.template:
        src: openssl-state.yaml.j2
        dest: "{{ openssl_state_file }}"
        mode: "0o644"
