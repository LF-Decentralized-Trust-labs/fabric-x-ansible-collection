- name: Find the container client to use
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: get_container_client

- name: Set container client socket
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: get_container_client_socket

- name: Find the containerd socket used by Docker
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: docker/get_containerd_socket
  when:
    - container_client == 'docker'

# Both /run and /var/run are mounted (not just the runtime socket file)
# because cAdvisor's Docker factory also dials the containerd socket that
# lives alongside it (e.g. /run/containerd/containerd.sock), and the cAdvisor
# image does not symlink one to the other internally — mounting only one of
# the two leaves the other empty inside the container.
# Podman doesn't get them: it only needs its API socket (mounted below), and
# binding the host /run lets Podman's default secrets mount try to mkdir
# /run/secrets on the host, which a rootless user isn't allowed to do.
- name: Set cAdvisor mandatory volumes
  ansible.builtin.set_fact:
    cadvisor_container_volumes:
      - "/:/rootfs:ro"
      - "/sys:/sys:ro"
      - "/dev/disk/:/dev/disk/:ro"

- name: Add Docker runtime and storage volumes
  vars:
    cadvisor_var_run_source: "{{ '/run' if ansible_facts.os_family == 'Darwin' else '/var/run' }}"
    cadvisor_docker_volumes:
      - "{{ cadvisor_var_run_source }}:/var/run:ro"
      - "/run:/run:ro"
      - "/var/lib/docker/:/var/lib/docker/:ro"
  ansible.builtin.set_fact:
    cadvisor_container_volumes: "{{ cadvisor_container_volumes + cadvisor_docker_volumes }}"
  when:
    - container_client == 'docker'

# Podman's storage root depends on who runs it: /var/lib/containers/storage
# when rootful, ~/.local/share/containers/storage when rootless. Ask Podman
# for the real location instead of assuming the system-wide one, which may
# not even exist on a rootless-only host.
- name: Add Podman storage volume
  when:
    - container_client == 'podman'
  block:
    # Socket discovery already fetched it, unless container_socket was set
    # explicitly and discovery was skipped.
    - name: Get Podman storage information
      containers.podman.podman_system_info:
      register: cadvisor_podman_info_output
      when:
        - container_podman_info_output is not defined
    - name: Add Podman graph root volume
      vars:
        cadvisor_podman_info: "{{ container_podman_info_output | default(cadvisor_podman_info_output) }}"
        cadvisor_podman_graph_root: "{{ cadvisor_podman_info.podman_system_info.store.graphRoot }}"
        cadvisor_podman_storage_volume: "{{ cadvisor_podman_graph_root }}:{{ cadvisor_podman_graph_root }}:ro"
      ansible.builtin.set_fact:
        cadvisor_container_volumes: "{{ cadvisor_container_volumes + [cadvisor_podman_storage_volume] }}"

# Docker Desktop for Mac's default context socket lives under $HOME (e.g.
# /Users/<user>/.docker/run/docker.sock) rather than /run or /var/run, so the
# Docker volumes above don't expose it inside the container. Bind-mount it
# explicitly whenever it isn't already covered by one of those paths (always
# the case for Podman, which gets no /run mounts).
- name: Add container runtime socket volume
  vars:
    cadvisor_socket_already_mounted: >-
      {{
        container_client == 'docker'
        and (container_socket_path | regex_search('^(/run|/var/run|/var/lib/docker)(/|$)')) is not none
      }}
    cadvisor_socket_volume: "{{ container_socket_path }}:{{ container_socket_path }}:ro"
  ansible.builtin.set_fact:
    cadvisor_container_volumes: "{{ cadvisor_container_volumes + [cadvisor_socket_volume] }}"
  when:
    - container_socket_path is defined
    - container_socket_path | length > 0
    - not cadvisor_socket_already_mounted

- name: Start cAdvisor container
  vars:
    container_name: "{{ cadvisor_container_name }}"
    container_image: "{{ cadvisor_image }}"
    # Unlike --docker/--podman, --containerd takes a bare path, not a unix://
    # URI. container_containerd_socket_path (set by docker/get_containerd_socket)
    # already accounts for the standard vs Docker-bundled location.
    container_command: >-
      --port={{ cadvisor_port }}
      --housekeeping_interval={{ cadvisor_housekeeping_interval }}
      --store_container_labels=false
      {% if cadvisor_disable_metrics | length > 0 %}
      --disable_metrics={{ cadvisor_disable_metrics }}
      {% endif %}
      {% if container_client == 'podman' %}
      --podman={{ container_socket }}
      {% else %}
      --docker={{ container_socket }}
      --containerd={{ container_containerd_socket_path }}
      --docker_only=true
      {% endif %}
    container_ports:
      - "{{ cadvisor_port }}:{{ cadvisor_port }}"
    container_volumes: "{{ cadvisor_container_volumes }}"
    # Shares the host's cgroup namespace so cAdvisor can read other containers'
    # cgroup stats, not just its own.
    container_cgroupns_mode: host
    container_healthcheck_test: >-
      wget --quiet
      --tries=1
      --spider http://localhost:{{ cadvisor_port }}/healthz
    container_wait_until_running: true
    container_wait_port: "{{ cadvisor_port }}"
    container_security_opts:
      - label=disable
  ansible.builtin.include_role:
    name: hyperledger.fabricx.container
    tasks_from: start
