# AWX/Automation Controller installs this file's collections into the
# Execution Environment on every Project SCM sync. It lets job templates
# resolve the hyperledger.fabricx.* FQCN even though the Project checkout
# itself is a plain git clone, not an installed collection.
#
# If the AWX Project source is pointed at a private/enterprise mirror
# (e.g. github.ibm.com) instead of the public repository below, update the
# "name" URL of the hyperledger.fabricx entry to match that mirror.
collections:
  - name: https://github.com/LF-Decentralized-Trust-labs/fabric-x-ansible-collection.git
    type: git
    version: main
