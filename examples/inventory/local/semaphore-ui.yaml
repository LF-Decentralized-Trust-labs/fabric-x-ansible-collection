# This inventory deploys a standalone Semaphore UI instance on the local control node.
# Unlike the other sample inventories under `local/`, this is not a Fabric-X network
# sample: Semaphore UI is a general automation controller for this collection's
# playbooks and inventories, deployed independently through the `semaphore_ui` role
# and its companion playbooks (see playbooks/semaphore_ui/).
#
# Semaphore UI is kept in its own dedicated inventory, separate from every network
# inventory: it is meant to run and drive many inventories/playbooks.

all:
  children:
    semaphore_ui:
      hosts:
        semaphore:
          semaphore_ui_port: 3010
          semaphore_ui_username: admin
          semaphore_ui_password: adminPWD
          semaphore_ui_email: admin@example.com
          semaphore_ui_use_tls: true
