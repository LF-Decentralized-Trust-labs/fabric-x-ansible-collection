# =========================
# Ansible Connection
# =========================
# Every play in this family — including the `hosts: localhost` control-node
# plays (crypto, genesis, and config generation) — runs over SSH on a single
# control host. That host must have the prerequisites installed (a container
# engine, and Go or prebuilt Fabric-X binaries); see
# `hyperledger.fabricx.install_prerequisites`.
#
# This is what makes the family usable from AWX: an AWX job's own runner pod is
# ephemeral and has no container engine, and it does not share a filesystem
# between steps. By pointing the whole inventory at one persistent control host,
# every step (generation on `localhost` and the per-service container plays)
# executes on that host, on one shared filesystem — exactly as if you had run the
# `local` family directly on it.
#
# Provide the control host address via the `awx_control_host` inventory variable
# (recommended in AWX) or the `AWX_CONTROL_HOST` environment variable (convenient
# from the CLI). Authentication (user + SSH private key) is expected to come from
# an AWX Machine credential attached to the job template; `ansible_user` falls
# back to `AWX_CONTROL_USER` (default `ansible`) when running from the CLI.
ansible_connection: ssh
ansible_host: "{{ awx_control_host | default(lookup('env', 'AWX_CONTROL_HOST'), true) }}"
ansible_user: "{{ awx_control_user | default(lookup('env', 'AWX_CONTROL_USER') or 'ansible', true) }}"
actual_host: "{{ ansible_host }}"

# =========================
# Remote Node Paths
# =========================
# Single-host layout, identical to the `local` family: every service's files
# live under one deployment directory on the control host.
remote_deploy_dir: "{{ out_dir }}/local-deployment"
remote_node_dir: "{{ remote_deploy_dir }}/{{ inventory_hostname }}"
remote_config_dir: "{{ remote_node_dir }}/config"
remote_data_dir: "{{ remote_node_dir }}/data"
