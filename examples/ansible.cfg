[defaults]
# Inventory file loaded by default when none is passed with -i.
inventory = ./inventory/local/fabric-x.yaml
# Ansible Vault password source, resolved automatically instead of passing
# --vault-password-file on every command. This is a script (see the file for
# details): it reads ./.vault_pass if that file exists, so inventories with no
# Vault-encrypted content (every sample except local/fabric-x-vault.yaml) keep
# working with no password file present; only decrypting an actual
# Vault-encrypted value without ./.vault_pass in place will fail. See
# docs/tutorial/12-using-ansible-vault-for-secrets.md.
vault_password_file = ../scripts/resolve_vault_password.sh
# Number of hosts processed concurrently for each task. Raise this on inventories
# with many hosts or a fast control node (see FORKS in the Makefile); there is
# rarely a benefit to going far beyond the host count.
forks = 20
# Hide "skipped" task/host lines from the console output to keep it readable.
display_skipped_hosts = False
# Skip SSH host key verification prompts, since inventory hosts are ephemeral
# (local containers or freshly provisioned machines) and have no stable known_hosts entry.
host_key_checking = False
# Do not write *.retry files listing failed hosts after a failed run.
retry_files_enabled = False
# Connection timeout, in seconds, when establishing an SSH connection to a host.
timeout = 30
# Fact gathering policy: gather facts once per host per run and skip re-gathering
# for hosts that already have cached facts (see fact_caching below).
gathering = smart
# Fact cache backend. "jsonfile" persists gathered facts to disk so they survive
# across separate ansible-playbook invocations (e.g. the successive playbooks
# that "make setup" runs), instead of every invocation re-gathering from scratch.
fact_caching = jsonfile
# Directory where the jsonfile fact cache is stored. Relative paths here resolve
# against this file's own directory, so "../out" is this project's out/ dir
# (see OUT_DIR in the Makefile), which `make clean`/`clean-cache` already remove.
fact_caching_connection = ../out/ansible_fact_cache
# How long, in seconds, cached facts stay valid before being re-gathered.
fact_caching_timeout = 86400
# Suppress deprecation warnings in console output.
deprecation_warnings = False
# Auto-detect the remote Python interpreter without printing a discovery warning.
interpreter_python = auto_silent
# Compression used for Python modules shipped to remote hosts over SSH.
# ZIP_STORED skips compression: cheaper on CPU, slightly larger on the wire.
module_compression = ZIP_STORED

[ssh_connection]
# Pipe module code directly over the existing SSH connection instead of writing
# it to a temp file and executing it in a separate step, cutting SSH round-trips
# per task. Only affects hosts using ansible_connection=ssh (the "distributed"
# inventory); "local" and "k8s" inventories use ansible_connection=local and are unaffected.
pipelining = True
# Extra arguments passed to the ssh CLI:
#   -C                          enable SSH-level compression.
#   ControlMaster=auto          reuse one TCP+auth session across tasks and playbook runs.
#   ControlPersist=300s         keep that shared session open for 5 minutes after the last use.
#   PreferredAuthentications=publickey   skip negotiating other auth methods.
#   ServerAliveInterval=30      keep an idle multiplexed connection from being dropped.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey -o ServerAliveInterval=30
# Number of times to retry a failed SSH connection before giving up.
retries = 3
